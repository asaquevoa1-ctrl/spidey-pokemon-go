name: Spidey - QA responsivo Mega Chandelure
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/mega-chandelure-super-mega-raid-day-20261031-v1.png'
      - 'spidey-app/assets/events/premium/mega-chandelure-super-mega-raid-day-20261031-approved-v1.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'docs/qa/MEGA_CHANDELURE_ART_*.json'
      - 'tests/mega-chandelure-art-approval.test.cjs'
      - 'scripts/qa_mega_chandelure_art_browser.mjs'
      - '.github/workflows/spidey-mega-chandelure-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/mega-chandelure-art
          command -v google-chrome | tee test-results/mega-chandelure-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_mega_chandelure_art_browser.mjs 2>&1 | tee test-results/mega-chandelure-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-chandelure-responsive-preview
          path: test-results/mega-chandelure-art
