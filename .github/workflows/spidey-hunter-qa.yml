name: Spidey - navegação enxuta QA responsivo
on:
  pull_request:
    paths:
      - 'spidey-app/hunter-v1.js'
      - 'spidey-app/hunter-v1.css'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'scripts/qa_nav_partnerships_browser.mjs'
      - 'spidey-app/ana-airports.js'
      - 'spidey-app/national-trust-v1.js'
      - 'spidey-app/nav-partnerships.css'
      - 'spidey-app/app.js'
      - '.github/workflows/spidey-hunter-qa.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - name: Conferir ANA, National Trust, expiração e Caçador retirado
        run: |
          mkdir -p test-results/nav-partnerships
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_nav_partnerships_browser.mjs 2>&1 | tee test-results/nav-partnerships/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-partnerships-responsive-preview
          path: test-results/nav-partnerships
