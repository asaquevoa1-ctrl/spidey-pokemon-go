name: Spidey - descobrir e publicar novidades oficiais

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_official_news_to_app.py
      - scripts/test_official_news_sync.py
      - .github/workflows/spidey-official-news-autopublish.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: spidey-official-news-autopublish
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependências apenas para consulta oficial
        run: python -m pip install --quiet requests
      - name: Verificar contrato editorial sem rede
        run: |
          python -m unittest scripts.test_official_news_sync
          python -m json.tool spidey-app/data/events.json >/dev/null
      - name: Descobrir notícias oficiais ausentes no aplicativo
        run: python -m scripts.sync_official_news_to_app
      - name: Validar catálogo e contrato novamente
        run: |
          python -m unittest scripts.test_official_news_sync
          python -m json.tool spidey-app/data/events.json >/dev/null
          node --test tests/halloween-trick-or-treat-20261026.test.cjs
      - name: Publicar somente alterações de fato no GitHub
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add spidey-app/data/events.json
          if git diff --cached --quiet; then
            echo "Não há notícias oficiais novas. Nenhum commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Spidey: novidades oficiais verificadas automaticamente [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publicar no Pages porque push por GITHUB_TOKEN não dispara deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/spidey-pages.yml/dispatches" -f ref=main
          echo "Disparo de Pages solicitado. Não declarar deploy sem sucesso do workflow."
