name: Spidey - testar envio bot Discord

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-discord-send-test.yml"
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar envio e apagar
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: "1550963136519999658"
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ['DISCORD_BOT_TOKEN'].strip()
          channel = os.environ['CHANNEL_ID'].strip()
          headers = {
              'Authorization': f'Bot {token}',
              'User-Agent': 'SpideyPokemonGO/1.0',
              'Content-Type': 'application/json',
          }

          body = json.dumps({'content':'🧪 Spidey teste técnico de publicação — pode ignorar.'}).encode()
          req = urllib.request.Request(
              f'https://discord.com/api/v10/channels/{channel}/messages',
              data=body,
              headers=headers,
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode())
                  print('ENVIO_OK', data.get('id'))
                  mid = data.get('id')
          except urllib.error.HTTPError as e:
              print('ENVIO_FALHOU', e.code, e.read().decode()[:500])
              raise

          if mid:
              req = urllib.request.Request(
                  f'https://discord.com/api/v10/channels/{channel}/messages/{mid}',
                  headers={
                      'Authorization': f'Bot {token}',
                      'User-Agent': 'SpideyPokemonGO/1.0',
                  },
                  method='DELETE',
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print('DELETE_OK', r.status)
              except urllib.error.HTTPError as e:
                  print('DELETE_FALHOU', e.code, e.read().decode()[:500])
          PY
