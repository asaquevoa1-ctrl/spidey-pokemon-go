name: Spidey - recuperar mensagem especifica

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-recover-message-1552025400845271202.yml"
  workflow_dispatch:

jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - name: Rastrear entrada PokeMiners em todas as etapas
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SOURCE_CHANNEL_ID: "1550962794814373898"
          APPROVAL_CHANNEL_ID: "1550963072464715997"
          PUBLIC_CHANNEL_ID: "1550963136519999658"
          MESSAGE_ID: "1552025400845271202"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, requests
          token=os.environ['DISCORD_BOT_TOKEN'].strip()
          src=os.environ['SOURCE_CHANNEL_ID']; approval=os.environ['APPROVAL_CHANNEL_ID']; public=os.environ['PUBLIC_CHANNEL_ID']; mid=os.environ['MESSAGE_ID']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          rc=requests.get(f'https://discord.com/api/v10/channels/{src}',headers=h,timeout=30); rc.raise_for_status(); ch=rc.json()
          guild=str(ch.get('guild_id') or '')
          source_url=f'https://discord.com/channels/{guild}/{src}/{mid}'
          print('SOURCE_URL',source_url)

          def scan(cid,label):
              r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':100},timeout=30)
              print(label+'_HTTP',r.status_code); r.raise_for_status(); msgs=r.json()
              hits=[]
              for m in msgs:
                  embeds=m.get('embeds') or []
                  text=(m.get('content') or '')+' '+ ' '.join((e.get('title') or '')+' '+(e.get('description') or '') for e in embeds)
                  exact=any(str(e.get('url') or '').strip()==source_url for e in embeds)
                  if exact or ('APK' in text.upper() and '21/09/2026' in text):
                      title=((embeds[0].get('title') if embeds else '') or '')
                      hits.append((int(m['id']),m['id'],title,exact))
              for _,msgid,title,exact in sorted(hits,reverse=True):
                  print(label+'_HIT',msgid,'EXACT',exact,'TITLE',title)
                  print(label+'_LINK',f'https://discord.com/channels/{guild}/{cid}/{msgid}')
              return hits

          a=scan(approval,'APPROVAL')
          p=scan(public,'PUBLIC')
          print('APPROVAL_COUNT',len(a)); print('PUBLIC_COUNT',len(p))
          PY
