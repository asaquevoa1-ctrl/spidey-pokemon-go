name: Spidey - publicar automaticamente no Canal

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_whapi_channel.py"
      - ".github/workflows/spidey-whapi-channel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar modo automatico
        run: python scripts/patch_whapi_channel.py

      - name: Validar sintaxe
        run: python -m py_compile bot.py

      - name: Validar integracao estatica
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'def _publicar_whapi' bot.py
          grep -q 'WHAPI_TOKEN' bot.py
          grep -q '/messages/image' bot.py
          grep -q '✅ WHATSAPP PUBLICADO' bot.py

      - name: Gravar alteracao
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "Modo Whapi ja aplicado."
            exit 0
          fi
          git commit -m "Spidey: publica automaticamente no Canal via Whapi [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
