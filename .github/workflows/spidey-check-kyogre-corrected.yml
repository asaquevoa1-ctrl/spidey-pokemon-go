name: Spidey - validar imagem Kyogre corrigido

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-check-kyogre-corrected.yml"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Validar imagem da mensagem Kyogre
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
          MESSAGE_ID: "1552109594954960928"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, requests
          token=os.environ['DISCORD_BOT_TOKEN'].strip(); cid=os.environ['APPROVAL_CHANNEL_ID']; mid=os.environ['MESSAGE_ID']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages/{mid}',headers=h,timeout=30)
          print('MSG_HTTP',r.status_code); r.raise_for_status(); m=r.json()
          embeds=m.get('embeds') or []
          title=((embeds[0].get('title') if embeds else '') or '')
          desc=((embeds[0].get('description') if embeds else '') or '')
          image=((embeds[0].get('image') or {}).get('url') if embeds else '') or ''
          proxy=((embeds[0].get('image') or {}).get('proxy_url') if embeds else '') or ''
          print('TITLE',title)
          print('ATTACHMENTS',len(m.get('attachments') or []))
          print('HAS_RAW_LINK','POKEMONGO.COM/' in desc.upper())
          print('IMAGE_URL',repr(image))
          print('PROXY_URL',repr(proxy))
          test=proxy or image
          if not test or test.startswith('attachment://'):
              raise SystemExit('IMAGEM_NAO_PUBLICA')
          ir=requests.get(test,timeout=30)
          print('IMAGE_HTTP',ir.status_code)
          print('IMAGE_TYPE',ir.headers.get('content-type'))
          print('IMAGE_BYTES',len(ir.content))
          ir.raise_for_status()
          if len(ir.content) < 50000:
              raise SystemExit('IMAGEM_PEQUENA_OU_INVALIDA')
          print('VALIDATED_LINK',f'https://discord.com/channels/1139279003451150467/{cid}/{mid}')
          PY
