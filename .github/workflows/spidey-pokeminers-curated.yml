name: Spidey - PokeMiners curado

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-pokeminers-curated
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      POKEMINERS_CHANNEL_ID: "1550962794814373898"
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      POKEMINERS_STATE_FILE: "last_pokeminers.txt"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        run: python -m pip install --quiet requests

      - name: Verificar PokeMiners e enfileirar conteúdo curado
        run: python -m scripts.pokeminers_curated_monitor

      - name: Salvar antirrepetição
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- last_pokeminers.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_pokeminers.txt
          git commit -m "Spidey: atualiza controle PokeMiners curado"
          git pull --rebase origin main
          git push origin HEAD:main
