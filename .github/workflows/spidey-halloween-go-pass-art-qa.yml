name: Spidey - QA responsivo Halloween GO Pass
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/halloween-go-pass-20261027-1105-v1.png'
      - 'spidey-app/assets/events/premium/halloween-go-pass-20261027-1105-approved-v1.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/data/events.json'
      - 'spidey-app/sw.js'
      - 'scripts/qa_halloween_go_pass_art_browser.mjs'
      - 'docs/qa/HALLOWEEN_GO_PASS_ART_CANDIDATE_20261012.json'
      - 'docs/qa/HALLOWEEN_GO_PASS_ART_APPROVAL_20261012.json'
      - 'tests/halloween-go-pass-art-approval.test.cjs'
      - '.github/workflows/spidey-halloween-go-pass-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/halloween-go-pass-art
          command -v google-chrome | tee test-results/halloween-go-pass-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_halloween_go_pass_art_browser.mjs 2>&1 | tee test-results/halloween-go-pass-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halloween-go-pass-responsive-preview
          path: test-results/halloween-go-pass-art
