name: Spidey - QA responsivo Pokemon Night Out
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/pokemon-night-out-20261024-v1.png'
      - 'spidey-app/assets/events/premium/pokemon-night-out-20261024-approved-v1.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'docs/qa/POKEMON_NIGHT_OUT_ART_*.json'
      - 'tests/pokemon-night-out-art-approval.test.cjs'
      - 'scripts/qa_pokemon_night_out_art_browser.mjs'
      - '.github/workflows/spidey-pokemon-night-out-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/pokemon-night-out-art
          command -v google-chrome | tee test-results/pokemon-night-out-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_pokemon_night_out_art_browser.mjs 2>&1 | tee test-results/pokemon-night-out-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-night-out-responsive-preview
          path: test-results/pokemon-night-out-art
