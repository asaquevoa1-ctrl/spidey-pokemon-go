name: Spidey - enviar ESA exclusiva para aprovacao

on:
  push:
    paths:
      - ".github/workflows/spidey-send-esa-exclusive.yml"

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: spidey-assets
          fetch-depth: 0

      - name: Baixar e validar arte final World Space Week
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --silent --show-error --fail --location \
            "https://ucfd9167d1178d283833f6542911.dl.dropboxusercontent.com/cd/0/get/DIjJnIKeHku2jyoG9j5-_I3nnUPuCfNCwqB2skbaNRZzT1_O7bKvKOsBYdAAj00TaJ-yGVJ7tSlu7dp0CF70o8SIuVy989FxmQQD29qa7udHs7wikxpBCC6FcJ8o_nA334Y50yBQPQP72qiLBZGlUWMOR0i42RT8TMxX4H1leu3nIg/file?c_luid=4b888265" \
            -o assets/spidey-esa-world-space-week-2026-final.png

          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p = 'assets/spidey-esa-world-space-week-2026-final.png'
          img = Image.open(p)
          print('Arte ESA final:', img.size)
          if img.width < 1000 or img.height < 1200:
              raise SystemExit(f'Arte abaixo do padrão Spidey: {img.width}x{img.height}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spidey-esa-world-space-week-2026-final.png
          if ! git diff --cached --quiet; then
            git commit -m "Spidey: salva arte final World Space Week 2026"
            git push origin HEAD:spidey-assets
          fi

      - name: Enviar evento ESA para aprovacao
        shell: bash
        run: |
          set -euo pipefail
          resposta=$(curl --silent --show-error --fail-with-body --max-time 120 \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "https://spidey-pokemon-go.onrender.com/enviar" <<'JSON'
          {
            "titulo": "🚀 EVENTO • World Space Week 2026 • Pikachu Astronauta",
            "mensagem": "Pokémon GO e a Agência Espacial Europeia terão um evento especial ligado à World Space Week 2026.\n\n🚀 Pikachu Astronauta em destaque\n✨ Pode ser Shiny\n🛰️ Reides presenciais e Fundos de Localização em locais participantes\n🔭 Pesquisa Temporária\n📡 De 4 a 10 de outubro: Pesquisa de Campo e aparições aumentadas de Pikachu, Clefairy, Magnemite, Starmie, Lunatone, Solrock, Elgyem e Blipbug\n\nMuseus participantes: Londres, Toulouse, Nuremberg, Valência, Noordwijk e Transinne.\n\nFonte oficial: Pokémon GO / ESA",
            "url": "https://pokemongo.com/en/news/european-space-agency-event",
            "imagem_url": "https://raw.githubusercontent.com/asaquevoa1-ctrl/spidey-pokemon-go/spidey-assets/assets/spidey-esa-world-space-week-2026-final.png",
            "gerar_arte": false,
            "gerar_gpx": false,
            "aprovar": true
          }
          JSON
          )
          echo "$resposta"
          python - <<'PY' "$resposta"
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get('status') == 'enviado', data
          assert data.get('etapa') == 'aguardando_aprovacao', data
          assert data.get('arte') is True, data
          assert data.get('modo_arte') == 'fornecida', data
          print('OK: ESA enviada com arte final fornecida e aguardando aprovação')
          PY
