name: Spidey - validar fluxo Discord v5

on:
  push:
    branches: [main]
    paths: [".github/workflows/spidey-validate-discord-flow-v5.yml"]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      APPROVAL_CHANNEL_ID: "1550963072464715997"
      SPIDEY_ENDPOINT: "https://spidey-pokemon-go.onrender.com/enviar"
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install -r requirements.txt
      - name: Validar logo oficial local
        run: |
          python - <<'PY'
          import spidey_art_v4 as a
          logo=a._logo_oficial(); assert logo is not None, 'logo ausente'; assert logo.size==(128,128),logo.size
          card=a.criar_card('📰 NOTÍCIA • TESTE','Validação do logo oficial do Spidey. Fonte oficial: Pokémon GO.')
          assert len(card)>50000,len(card)
          print('LOGO_OFICIAL_OK',logo.size); print('FALLBACK_COM_LOGO_OK',len(card))
          PY
      - name: Aguardar deploy do backend
        run: sleep 90
      - name: Validar disparo real e limpar teste
        shell: bash
        run: |
          python - <<'PY'
          import os,re,time,requests
          tok=os.environ['DISCORD_BOT_TOKEN'].strip(); cid=os.environ['APPROVAL_CHANNEL_ID']; ep=os.environ['SPIDEY_ENDPOINT']
          h={'Authorization':f'Bot {tok}','User-Agent':'SpideyPokemonGO/1.0'}
          def get():
            r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':50},timeout=30); r.raise_for_status(); return r.json()
          before={m['id'] for m in get()}
          p={'titulo':'🧪 TESTE FLUXO DISCORD V5','mensagem':'Validação técnica.\n\n📌 Fonte: teste interno.\n🕷️ Será removido automaticamente.','url':None,'gerar_gpx':False,'gerar_arte':True,'usar_premium':False,'permitir_fallback':True,'aprovar':True}
          r=requests.post(ep,json=p,timeout=180); print('SPIDEY_HTTP',r.status_code,r.text[:500]); r.raise_for_status(); d=r.json(); assert d.get('status')=='enviado' and d.get('etapa')=='aguardando_aprovacao' and d.get('arte') is True,d
          time.sleep(3); new=[m for m in get() if m['id'] not in before]
          hits=[]
          for m in new:
            e=(m.get('embeds') or [{}])[0]; t=((e.get('title') or '')+' '+(e.get('description') or '')).upper()
            if 'TESTE FLUXO DISCORD V5' in t:hits.append(m)
          assert len(hits)==1,f'cards={len(hits)} novas={[m["id"] for m in new]}'
          m=hits[0]; e=(m.get('embeds') or [{}])[0]; desc=e.get('description') or ''
          assert '[APROVAR]' in desc and '[REPROVAR]' in desc,desc
          assert not [x for x in new if 'DECIDA ABAIXO' in (x.get('content') or '').upper()]
          img=(e.get('image') or {}).get('proxy_url') or (e.get('image') or {}).get('url') or ''; assert img
          ir=requests.get(img,timeout=30); ir.raise_for_status(); assert ir.headers.get('content-type','').startswith('image/') and len(ir.content)>50000
          rej=re.search(r'\[REPROVAR\]\((https?://[^)]+)\)',desc,re.I); assert rej
          rr=requests.get(rej.group(1),timeout=30); print('REPROVAR_HTTP',rr.status_code); rr.raise_for_status(); assert 'rejeitada' in rr.text.lower()
          print('UM_CARD_OK'); print('ARTE_NO_MESMO_CARD_OK',len(ir.content)); print('LINKS_NO_MESMO_CARD_OK'); print('TEST_ID',m['id'])
          dr=requests.delete(f'https://discord.com/api/v10/channels/{cid}/messages/{m["id"]}',headers=h,timeout=30); print('LIMPEZA_HTTP',dr.status_code)
          PY
      - name: Validar aprovação fallback local
        run: |
          python - <<'PY'
          import bot
          from spidey_approval import criar_token
          enviados=[]
          bot._whapi_configurado=lambda:False; bot.mandar_discord=lambda *a,**k:enviados.append((a,k)); bot.mandar_coordenadas_cruas=lambda *a,**k:None
          bot.tokens_processados.clear(); bot._segredo_aprovacao=lambda:'segredo-teste'
          d={'titulo':'🧪 FALLBACK','mensagem':'Teste fallback','url':None,'coordenadas':[],'gerar_gpx':False,'gpx_nome':'x.gpx','gerar_arte':True,'usar_premium':False,'permitir_fallback':True,'imagem_url':None}
          t=criar_token(d,'segredo-teste'); resp=bot.app.test_client().get('/aprovar?t='+t)
          print('APROVAR_HTTP',resp.status_code); assert resp.status_code==200,resp.data[:400]; assert enviados
          print('APROVACAO_FALLBACK_OK')
          PY
