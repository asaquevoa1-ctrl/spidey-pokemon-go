name: Spidey - reenviar G47IX aprovado

# disparo corrigido em 22/09/2026 com arte original aprovada
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-resend-g47ix-approved.yml"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar G47IX corrigido ao Discord
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          {
            "titulo": "🕷️ ULTRA BEASTS • RAIDS REGIONAIS DE 5 ESTRELAS",
            "mensagem": "📅 Período: 23 a 29 de setembro de 2026\n⏰ Início: 10h — horário local de cada região\n\n⚡ Xurkitree — Ásia-Pacífico\n🪽 Pheromosa — Europa, Oriente Médio, África e Índia\n💪 Buzzwole — Américas e Groenlândia\n\n🇧🇷 Brasil: Buzzwole disponível a partir das 10h (Brasília) em 23/09.\n\n🌟 Hora de Reides: 23/09, das 18h às 19h — horário local.\n✨ Chance de Brilhante disponível.\n\nFonte: G47IX.",
            "imagem_url": "https://ucbfee9316183f3fab1b9fa40029.dl.dropboxusercontent.com/cd/0/get/DIndeDGdbzHaID5ktDiO4Vuy5bMlgBxmmZDvg-F-Kwf8YWIhNSAHbROx9kPUhsoigPBTTbL35GXatdljdaPvB-oGkLPmBu1ttTFBxItj3Z5XiDH2oc_ClQSqISzqNKfTFaKKIIfhk5hRH14kynoo2bZSK0YQpyvnw8BjflyW2_3sWQ/file?c_luid=4b888265",
            "coordenadas": [],
            "gerar_gpx": false,
            "gerar_arte": false,
            "aprovar": true
          }
          JSON

          code=$(curl --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 240 --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            -o /tmp/resp.json -w '%{http_code}' \
            https://spidey-pokemon-go.onrender.com/enviar || true)

          echo "HTTP $code"
          cat /tmp/resp.json

          python - <<'PY'
          import json
          d=json.load(open('/tmp/resp.json', encoding='utf-8'))
          assert d.get('status') == 'enviado', d
          assert d.get('etapa') == 'aguardando_aprovacao', d
          assert d.get('arte') is True, d
          assert d.get('modo_arte') == 'fornecida', d
          assert d.get('gpx') is False, d
          print('G47IX_CORRIGIDO_VALIDADO')
          PY
