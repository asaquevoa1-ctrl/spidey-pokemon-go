name: Spidey - corrigir fallback de arte do Discord

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-fix-discord-art-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Corrigir backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')

          if 'import re\n' not in s:
              s=s.replace('import os\n', 'import os\nimport re\n', 1)

          old='''        if imagem_bytes or gpx_bytes:\n            payload_conteudo.pop("attachments", None)\n            resposta_conteudo = requests.post(\n                webhook_url,\n                data={"payload_json": json.dumps(payload_conteudo, ensure_ascii=False)},\n                files=files,\n                timeout=60,\n            )'''
          new='''        if imagem_bytes or gpx_bytes:\n            resposta_conteudo = requests.post(\n                webhook_url,\n                data={"payload_json": json.dumps(payload_conteudo, ensure_ascii=False)},\n                files=files,\n                timeout=60,\n            )'''
          if old not in s:
              raise SystemExit('Trecho fallback Discord esperado não encontrado')
          s=s.replace(old,new,1)

          marker='''    mensagem_original = dados.get("mensagem", "")\n    if not mensagem_original:\n        raise ValueError("Mensagem vazia")\n'''
          replacement='''    mensagem_original = dados.get("mensagem", "")\n    if not mensagem_original:\n        raise ValueError("Mensagem vazia")\n\n    # Notícias oficiais detectadas pelo PokeMiners devem chegar limpas e com arte.\n    # O link continua servindo para a detecção na origem, mas não é exibido no card.\n    if "OFICIAL" in str(titulo).upper() and "POKEMINERS" in mensagem_original.upper():\n        mensagem_original = re.sub(\n            r"🔗\\s*Fonte oficial:\\s*https?://\\S+",\n            "📌 Fonte oficial: Pokémon GO",\n            mensagem_original,\n            flags=re.I,\n        )\n        dados = dict(dados)\n        dados["url"] = None\n        dados["gerar_arte"] = True\n        dados["usar_premium"] = False\n        dados["permitir_fallback"] = True\n'''
          if marker not in s:
              raise SystemExit('Ponto de preparação de conteúdo não encontrado')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Spidey: preservar arte no fallback Discord"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar Render atualizar
        shell: bash
        run: |
          set -euo pipefail
          sleep 75
          for i in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/health.txt -w "%{http_code}" --max-time 20 "https://spidey-pokemon-go.onrender.com/" || true)
            echo "Health $i: HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.txt
              break
            fi
            sleep 15
          done

      - name: Reenviar Kyogre e validar anexo
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
          SPIDEY_ENDPOINT: "https://spidey-pokemon-go.onrender.com/enviar"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, requests, time
          endpoint=os.environ['SPIDEY_ENDPOINT']; token=os.environ['DISCORD_BOT_TOKEN'].strip(); dst=os.environ['APPROVAL_CHANNEL_ID']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          payload={
            'titulo':'🌊 GO PASS • OUTUBRO • KYOGRE',
            'mensagem':(
              'Pokémon GO anunciou o GO Pass: outubro de 2026.\n\n'
              '📅 Período: 6 de outubro, 10h → 3 de novembro, 10h — horário local.\n'
              '🌊 Recompensa em destaque: encontro com Kyogre, com chance de Brilhante.\n'
              '🎟️ GO Pass Deluxe: o Lucky Trinket retorna como recompensa final.\n'
              '🎁 Também há Doce Raro GG, Passe de Batalha Premium e Ovo da Sorte entre as recompensas.\n'
              '⏳ Recompensas desbloqueadas expiram em 5 de novembro, às 10h, horário local.\n'
              '🍀 O Lucky Trinket expira em 8 de novembro de 2026, às 23h59, horário local.\n\n'
              '📌 Fonte oficial: Pokémon GO\n'
              '🔎 Detectado por PokeMiners #miner-bot.'
            ),
            'url':None,
            'gerar_gpx':False,
            'gerar_arte':True,
            'usar_premium':False,
            'permitir_fallback':True,
            'aprovar':True,
          }
          r=requests.post(endpoint,json=payload,timeout=180)
          print('SPIDEY_HTTP',r.status_code); print('SPIDEY_RESPONSE',r.text[:1000]); r.raise_for_status()
          data=r.json(); assert data.get('status')=='enviado' and data.get('arte') is True, data
          time.sleep(2)
          rr=requests.get(f'https://discord.com/api/v10/channels/{dst}/messages',headers=h,params={'limit':30},timeout=30); rr.raise_for_status()
          for m in rr.json():
              embeds=m.get('embeds') or []
              title=((embeds[0].get('title') if embeds else '') or '')
              desc=((embeds[0].get('description') if embeds else '') or '')
              image=((embeds[0].get('image') or {}).get('url') if embeds else '') or ''
              if 'KYOGRE' in title.upper() and 'GO PASS' in title.upper() and 'pokemongo.com/' not in desc.lower():
                  print('CANDIDATE',m['id'],'ATTACHMENTS',len(m.get('attachments') or []),'IMAGE',bool(image))
                  if m.get('attachments') and image:
                      print('VALIDATED_LINK',f'https://discord.com/channels/1139279003451150467/{dst}/{m["id"]}')
                      raise SystemExit(0)
          raise SystemExit('Kyogre corrigido sem arte anexada no Discord')
          PY
