name: Spidey - publicar aprovados no Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discord_publish_bridge.py"
      - ".github/workflows/spidey-publish-bridge.yml"

permissions:
  contents: write

concurrency:
  group: spidey-publish-bridge
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        run: python -m pip install --quiet requests

      - name: Publicar aprovados e reconciliar fila
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
          PUBLIC_CHANNEL_ID: "1550963136519999658"
        run: python scripts/discord_publish_bridge.py

      - name: Gravar estado publicado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/curated || true
          if git diff --cached --quiet; then
            echo "Nenhuma publicação nova para registrar."
            exit 0
          fi
          git commit -m "Spidey: registra publicação editorial [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
