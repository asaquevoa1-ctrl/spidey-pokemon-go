name: Spidey - publicar aprovados no Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discord_publish_bridge.py"
      - ".github/workflows/spidey-publish-bridge.yml"

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Python
        run: python -m pip install --quiet requests

      - name: Copiar aprovados para publicadas-whatsapp
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
          PUBLIC_CHANNEL_ID: "1550963136519999658"
        run: python scripts/discord_publish_bridge.py
