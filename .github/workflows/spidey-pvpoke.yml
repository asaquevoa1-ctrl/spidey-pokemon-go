name: Spidey - atualizar PvPoke
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
concurrency:
  group: spidey-pvpoke-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importar e validar sem acessar dados dos jogadores
        run: python scripts/sync_pvpoke.py
      - name: Gravar somente se o PvPoke mudou
        run: |
          git add spidey-app/data/pvp.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Spidey PvP: atualiza rankings verificados [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
