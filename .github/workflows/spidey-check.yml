name: Spidey - checar noticias

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-news-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Verificar noticia oficial
        shell: bash
        run: |
          set -euo pipefail

          CHECK="https://spidey-pokemon-go.onrender.com/check-oficial"
          ENVIAR="https://spidey-pokemon-go.onrender.com/enviar"

          echo "Consultando Spidey..."

          JSON="$(curl \
            --retry 3 \
            --retry-delay 10 \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            "$CHECK")"

          echo "$JSON"

          URL="$(python -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<< "$JSON")"
          TITULO="$(python -c 'import json,sys; print(json.load(sys.stdin)["titulo"])' <<< "$JSON")"

          if [ ! -f last_news.txt ]; then
            echo "Primeira execução."
            echo "Registrando notícia atual sem republicar."

            printf '%s\n' "$URL" > last_news.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add last_news.txt
            git commit -m "Spidey: inicializa controle de noticias"
            git push

            exit 0
          fi

          LAST="$(tr -d '\r\n' < last_news.txt)"

          if [ "$URL" = "$LAST" ]; then
            echo "Sem novidade."
            exit 0
          fi

          echo "Nova notícia oficial encontrada!"
          echo "$URL"

          PAYLOAD="$(python - "$TITULO" "$URL" <<'PY'
          import json
          import sys

          titulo, url = sys.argv[1:3]
          print(json.dumps({
              "titulo": "📰 OFICIAL • NOTÍCIA",
              "mensagem": f"{titulo}\n\nFonte: Pokémon GO oficial",
              "url": url,
              "gerar_arte": True,
              "aprovar": True
          }, ensure_ascii=False))
          PY
          )"

          RESULT="$(curl \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 240 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            "$ENVIAR")"

          echo "$RESULT"

          python - "$RESULT" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])
          if data.get("status") != "enviado":
              raise SystemExit("Spidey não confirmou o envio")
          if data.get("etapa") != "aguardando_aprovacao":
              raise SystemExit("Notícia oficial não entrou em aprovação")
          PY

          printf '%s\n' "$URL" > last_news.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_news.txt
          git commit -m "Spidey: atualiza ultima noticia"
          git pull --rebase origin main
          git push origin HEAD:main
