name: Spidey - corrigir binario Rattata e enviar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-fix-rattata-binary-and-send.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir-e-enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Converter WebP valido para JPEG e validar pixels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow requests
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          src=Path('assets/approved/2026-09-24/spidey-holofote-rattata.webp')
          dst=Path('assets/approved/2026-09-24/spidey-holofote-rattata-final.jpg')
          im=Image.open(src).convert('RGB')
          assert im.width >= 1000 and im.height >= 1200, im.size
          mean=ImageStat.Stat(im.resize((64,64))).mean
          assert max(mean) > 20, mean
          im.save(dst,'JPEG',quality=90,optimize=True,progressive=False)
          test=Image.open(dst).convert('RGB')
          mean2=ImageStat.Stat(test.resize((64,64))).mean
          assert max(mean2) > 20, mean2
          assert dst.stat().st_size > 100000, dst.stat().st_size
          print('ARTE_BINARIA_OK',test.size,dst.stat().st_size,tuple(round(x,1) for x in mean2))
          PY

      - name: Salvar JPEG binario real
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved/2026-09-24/spidey-holofote-rattata-final.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Spidey: salvar JPEG valido Hora do Holofote Rattata"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enviar versão final limpa para aprovação
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='https://raw.githubusercontent.com/asaquevoa1-ctrl/spidey-pokemon-go/main/assets/approved/2026-09-24/spidey-holofote-rattata-final.jpg'
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 30 "$IMAGE" -o /tmp/rattata.jpg; then
              if python - <<'PY'
          from PIL import Image, ImageStat
          im=Image.open('/tmp/rattata.jpg').convert('RGB')
          mean=ImageStat.Stat(im.resize((64,64))).mean
          assert im.width >= 1000 and im.height >= 1200
          assert max(mean) > 20
          print('RAW_IMAGE_OK',im.size,tuple(round(x,1) for x in mean))
          PY
              then break; fi
            fi
            sleep 4
          done

          cat > /tmp/payload.json <<'JSON'
          {
            "titulo": "✨ HORA DO HOLOFOTE • RATTATA",
            "mensagem": "📅 24 de setembro de 2026\n⏰ 18h às 19h — horário local\n✨ Brilhante disponível\n🎁 Bônus: 2× XP por evolução\n📏 Chance aumentada de Rattata XXS\n\n🇧🇷 **HORÁRIOS DE BRASÍLIA**\n📅 **24 DE SETEMBRO**\n\n**01h00** 🇰🇮 Kiritimati, Kiribati\n`1.987149,-157.477137`\n**03h00** 🇳🇿 Auckland, Nova Zelândia\n`-36.852095,174.763180`\n**05h00** 🇦🇺 Sydney, Austrália\n`-33.866173,151.205945`\n**06h00** 🇯🇵 Shinjuku, Japão\n`35.688950,139.690540`\n**07h00** 🇸🇬 Singapura\n`1.292400,103.847600`\n**09h30** 🇮🇳 Chennai, Índia\n`13.040300,80.266600`\n**11h00** 🇦🇪 Dubai, Emirados Árabes\n`25.076750,55.132940`\n**12h00** 🇹🇷 Istambul, Turquia\n`41.008200,28.978400`\n**13h00** 🇪🇸 Zaragoza, Espanha\n`41.661609,-0.894640`\n**14h00** 🇬🇧 Londres, Reino Unido\n`51.501000,-0.124600`\n**16h00** 🇨🇻 Praia, Cabo Verde\n`14.910725,-23.527823`\n**17h00** 🇧🇷 Fernando de Noronha\n`-3.840100,-32.411810`\n**18h00** 🇧🇷 Ibirapuera, São Paulo\n`-23.584171,-46.660725`\n**19h00** 🇺🇸 Central Park, Nova York\n`40.780300,-73.963000`\n**20h00** 🇺🇸 Chicago, EUA\n`41.898659,-87.623077`\n**21h00** 🇺🇸 Denver, EUA\n`39.739200,-104.990300`\n**22h00** 🇺🇸 Pier 39, São Francisco\n`37.809500,-122.410100`\n**23h00** 🇺🇸 Anchorage, Alasca\n`61.217019,-149.891609`\n\n📅 **DIA SEGUINTE • 25 DE SETEMBRO**\n\n**01h00** 🇺🇸 Honolulu, Havaí\n`21.265800,-157.821300`\n\n**02h00** 🇦🇸 Pago Pago, Samoa Americana\n`-14.277739,-170.688512`\n\n📌 Fonte oficial: Pokémon GO",
            "imagem_url": "https://raw.githubusercontent.com/asaquevoa1-ctrl/spidey-pokemon-go/main/assets/approved/2026-09-24/spidey-holofote-rattata-final.jpg",
            "gerar_arte": false,
            "usar_premium": false,
            "permitir_fallback": false,
            "arte_padrao_spidey": true,
            "aprovar": true,
            "gerar_gpx": false,
            "coordenadas": []
          }
          JSON

          code=$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            https://spidey-pokemon-go.onrender.com/enviar)
          cat /tmp/response.json; echo; echo "HTTP=$code"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/response.json',encoding='utf-8'))
          assert data.get('status') == 'enviado', data
          assert data.get('etapa') == 'aguardando_aprovacao', data
          assert data.get('arte') is True, data
          assert data.get('modo_arte') == 'fornecida', data
          print('RATTATA_FINAL_ENVIADO')
          PY
