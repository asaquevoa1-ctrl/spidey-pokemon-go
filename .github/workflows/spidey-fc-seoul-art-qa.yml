name: Spidey - QA responsivo FC Seoul Premium
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/fc-seoul-20261024-cosmic-s-v2.png'
      - 'spidey-app/assets/events/premium/fc-seoul-20261024-cosmic-s-approved-v2.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'spidey-app/data/events.json'
      - 'spidey-app/data/weekly.json'
      - 'weekly/**'
      - 'docs/qa/FC_SEOUL_ART_*.json'
      - 'tests/fc-seoul-art-approval.test.cjs'
      - 'scripts/qa_fc_seoul_art_browser.mjs'
      - '.github/workflows/spidey-fc-seoul-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          set -o pipefail
          mkdir -p test-results/fc-seoul-art
          command -v google-chrome | tee test-results/fc-seoul-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_fc_seoul_art_browser.mjs 2>&1 | tee test-results/fc-seoul-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc-seoul-responsive-preview
          path: test-results/fc-seoul-art
