name: Spidey - proteger resolucao de arte

on:
  push:
    paths:
      - ".github/workflows/spidey-guard-resolution.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bloquear arte de baixa resolucao
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("bot.py")
          s = p.read_text(encoding="utf-8")
          alvo = '            img = Image.open(io.BytesIO(resposta_imagem.content)).convert("RGB")\n            arquivo = io.BytesIO()\n'
          novo = '            img = Image.open(io.BytesIO(resposta_imagem.content)).convert("RGB")\n            if img.width < 1000 or img.height < 1200:\n                raise ValueError(f"Arte em baixa resolução: {img.width}x{img.height}; mínimo 1000x1200")\n            arquivo = io.BytesIO()\n'
          if 'Arte em baixa resolução' not in s:
              if alvo not in s:
                  raise SystemExit("bloco de imagem fornecida não encontrado")
              s = s.replace(alvo, novo, 1)
              p.write_text(s, encoding="utf-8")
          PY

          python -m py_compile bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if ! git diff --cached --quiet; then
            git commit -m "Spidey: bloqueia arte de baixa resolução"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
