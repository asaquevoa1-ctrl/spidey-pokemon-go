name: Spidey V2 TEST E1 - Entrada PokeMiners

on:
  push:
    branches:
      - spidey-v2-clean
    paths:
      - "scripts/v2_pokeminers_entry.py"
      - ".github/workflows/spidey-v2-pokeminers-entry.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-v2-test-e1-entry
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout V2
        uses: actions/checkout@v5
        with:
          ref: spidey-v2-clean
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install --quiet requests

      - name: Capturar somente entrada real PokeMiners
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          POKEMINERS_CHANNEL_ID: "1550962794814373898"
        run: python scripts/v2_pokeminers_entry.py

      - name: Persistir somente inbox do TESTE E
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/inbox/test_e.json
          if git diff --cached --quiet; then
            echo "Entrada já estava capturada; sem alteração."
            exit 0
          fi
          git commit -m "Spidey TEST E1: captura entrada real PokeMiners [skip ci]"
          git pull --rebase origin spidey-v2-clean
          git push origin HEAD:spidey-v2-clean
