name: Spidey V2 Clean - E2E único

on:
  push:
    branches:
      - spidey-v2-clean
    paths:
      - "v2/**"
      - ".github/workflows/spidey-v2-clean.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-v2-clean
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V2
        uses: actions/checkout@v5
        with:
          ref: spidey-v2-clean
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install --quiet requests pillow

      - name: Validar núcleo
        run: python -m py_compile v2/spidey_core.py v2/generate_gold_art.py

      - name: Gerar arte Gold full-size
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPIDEY_IMAGE_MODEL: "gpt-image-2.5-sunburst-2026-09-08"
          SPIDEY_IMAGE_QUALITY: "high"
        run: python v2/generate_gold_art.py

      - name: Rodar aprovação/publicação V2
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
          PUBLIC_CHANNEL_ID: "1550963136519999658"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python v2/spidey_core.py

      - name: Persistir estado e arte
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/queue v2/generated || true
          if git diff --cached --quiet; then
            echo "Sem alteração de estado."
            exit 0
          fi
          git commit -m "Spidey V2: atualiza arte/estado E2E [skip ci]"
          git pull --rebase origin spidey-v2-clean
          git push origin HEAD:spidey-v2-clean
