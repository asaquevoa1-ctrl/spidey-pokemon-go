name: Spidey - finaliza módulo Stamps

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/spidey-fix-stamps-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-app-stamps-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Corrigir UI e validação de coordenadas
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('spidey-app/index.html')
          text = index.read_text(encoding='utf-8')
          if '<link rel="stylesheet" href="stamps.css">' not in text:
              text = text.replace(
                  '<link rel="stylesheet" href="styles.css">',
                  '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="stamps.css">'
              )
          index.write_text(text, encoding='utf-8')

          app = Path('spidey-app/app.js')
          js = app.read_text(encoding='utf-8')
          old = """function validCoordinate(point) {\n  return Number.isFinite(Number(point?.latitude)) && Number.isFinite(Number(point?.longitude));\n}"""
          new = """function validCoordinate(point) {\n  const latRaw = point?.latitude;\n  const lonRaw = point?.longitude;\n  if (latRaw === null || latRaw === undefined || latRaw === '' || lonRaw === null || lonRaw === undefined || lonRaw === '') return false;\n  const latitude = Number(latRaw);\n  const longitude = Number(lonRaw);\n  return Number.isFinite(latitude) && Number.isFinite(longitude) && latitude >= -90 && latitude <= 90 && longitude >= -180 && longitude <= 180;\n}"""
          if old not in js:
              raise SystemExit('Função validCoordinate esperada não encontrada; abortando sem editar.')
          js = js.replace(old, new)
          app.write_text(js, encoding='utf-8')

          sw = Path('spidey-app/sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = re.sub(r"const CACHE = '[^']+';", "const CACHE = 'spidey-app-v1-20260928-stamps2-safe-coords';", sw_text, count=1)
          if "'./stamps.css'" not in sw_text or "'./data/stamps.json'" not in sw_text:
              raise SystemExit('Service worker não contém os assets Stamps esperados.')
          sw.write_text(sw_text, encoding='utf-8')

      - name: Validar arquivos
        run: |
          set -euo pipefail
          node --check spidey-app/app.js
          python -m json.tool spidey-app/data/events.json >/dev/null
          python -m json.tool spidey-app/data/stamps.json >/dev/null
          grep -F '<link rel="stylesheet" href="stamps.css">' spidey-app/index.html >/dev/null
          grep -F "spidey-app-v1-20260928-stamps2-safe-coords" spidey-app/sw.js >/dev/null
          if grep -q '0.000000, 0.000000' spidey-app/data/stamps.json; then
            echo 'Coordenada falsa encontrada no arquivo de dados.' >&2
            exit 1
          fi

      - name: Gravar correção em um único commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/spidey-fix-stamps-ui.yml
          git add spidey-app/index.html spidey-app/app.js spidey-app/sw.js
          git commit -m "Spidey App: finaliza Stamps e bloqueia coordenadas falsas"
          git pull --rebase origin main
          git push origin HEAD:main
