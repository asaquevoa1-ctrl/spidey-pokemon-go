name: Spidey - validar disparo Discord v7

on:
  push:
    branches: [main]
    paths: [".github/workflows/spidey-validate-discord-dispatch-v7.yml"]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      APPROVAL_CHANNEL_ID: "1550963072464715997"
      SPIDEY_ENDPOINT: "https://spidey-pokemon-go.onrender.com/enviar"
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install requests
      - name: Validar estrutura atual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('bot.py').read_text(encoding='utf-8')
          envio=s[s.index('@app.route("/enviar"'):s.index('@app.route("/aprovar"')]
          aprov=s[s.index('@app.route("/aprovar"'):s.index('@app.route("/whatsapp"')]
          assert 'components=_botoes_aprovacao(token)' not in envio
          assert 'Escolha uma opção:' in envio and '_links_aprovacao(token)' in envio
          assert 'and not conteudo["imagem_bytes"]' in aprov
          assert 'modo_arte' not in aprov.split('if _whapi_configurado()')[0]
          print('ESTRUTURA_DISCORD_OK')
          print('APROVACAO_ACEITA_ARTE_VALIDA_OK')
          PY
      - name: Testar disparo real controlado
        shell: bash
        run: |
          python - <<'PY'
          import os,re,time,requests
          token=os.environ['DISCORD_BOT_TOKEN'].strip()
          cid=os.environ['APPROVAL_CHANNEL_ID']
          endpoint=os.environ['SPIDEY_ENDPOINT']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          def messages():
              r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':50},timeout=30)
              r.raise_for_status(); return r.json()
          before={m['id'] for m in messages()}
          payload={
            'titulo':'🧪 TESTE CONTROLADO • DISCORD V7',
            'mensagem':'Validação técnica do novo disparo do Spidey.\n\n📌 Fonte: teste interno.\n🕷️ Esta mensagem será rejeitada e apagada automaticamente.',
            'url':None,
            'imagem_url':'https://raw.githubusercontent.com/asaquevoa1-ctrl/spidey-pokemon-go/main/assets/spidey-comic-con-malaga-2026-exclusive.png',
            'gerar_arte':False,
            'gerar_gpx':False,
            'aprovar':True,
          }
          r=requests.post(endpoint,json=payload,timeout=180)
          print('SPIDEY_HTTP',r.status_code)
          print('SPIDEY_RESPONSE',r.text[:800])
          r.raise_for_status()
          data=r.json()
          assert data.get('status')=='enviado' and data.get('etapa')=='aguardando_aprovacao',data
          assert data.get('arte') is True,data
          time.sleep(3)
          new=[m for m in messages() if m['id'] not in before]
          hits=[]
          for m in new:
              e=(m.get('embeds') or [{}])[0]
              text=((e.get('title') or '')+' '+(e.get('description') or '')).upper()
              if 'TESTE CONTROLADO' in text and 'DISCORD V7' in text:
                  hits.append(m)
          assert len(hits)==1,f'Esperava exatamente 1 card; encontrei {len(hits)}; novas={[m["id"] for m in new]}'
          m=hits[0]
          e=(m.get('embeds') or [{}])[0]
          desc=e.get('description') or ''
          assert '[APROVAR]' in desc and '[REPROVAR]' in desc,desc
          extras=[x for x in new if 'DECIDA ABAIXO' in (x.get('content') or '').upper()]
          assert not extras,[x['id'] for x in extras]
          img=(e.get('image') or {}).get('proxy_url') or (e.get('image') or {}).get('url') or ''
          assert img and not img.startswith('attachment://'),img
          ir=requests.get(img,timeout=30); ir.raise_for_status()
          assert ir.headers.get('content-type','').startswith('image/'),ir.headers
          assert len(ir.content)>50000,len(ir.content)
          reject=re.search(r'\[REPROVAR\]\((https?://[^)]+)\)',desc,re.I)
          assert reject,desc
          rr=requests.get(reject.group(1),timeout=30)
          print('REPROVAR_HTTP',rr.status_code)
          rr.raise_for_status()
          assert 'rejeitada' in rr.text.lower(),rr.text[:500]
          print('UM_UNICO_CARD_OK')
          print('ARTE_NO_MESMO_CARD_OK',len(ir.content))
          print('APROVAR_REPROVAR_NO_MESMO_CARD_OK')
          print('SEM_MENSAGEM_EXTRA_OK')
          print('TEST_MESSAGE_ID',m['id'])
          dr=requests.delete(f'https://discord.com/api/v10/channels/{cid}/messages/{m["id"]}',headers=h,timeout=30)
          print('LIMPEZA_HTTP',dr.status_code)
          if dr.status_code not in (204,404):
              print('AVISO_LIMPEZA',dr.text[:300])
          PY
