name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Buscar e classificar ultima publicacao G47IX
        shell: bash
        env:
          SPIDEY: https://spidey-pokemon-go.onrender.com/enviar
          STATE_FILE: last_g47ix.txt
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          set -euo pipefail

          META_FILE="$(mktemp)"
          FX_FILE="$(mktemp)"
          DDG_FILE="$(mktemp)"
          trap 'rm -f "$META_FILE" "$FX_FILE" "$DDG_FILE"' EXIT

          echo "Consultando timeline pública do G47IX..."

          FX_CODE="$(curl \
            --location \
            --compressed \
            --connect-timeout 15 \
            --max-time 60 \
            --silent \
            --show-error \
            --user-agent "Mozilla/5.0" \
            --output "$FX_FILE" \
            --write-out '%{http_code}' \
            'https://api.fxtwitter.com/2/profile/g47ix/media?count=20' || true)"

          SOURCE=""

          if [[ "$FX_CODE" == "200" ]] && python3 - "$FX_FILE" "$META_FILE" <<'PY'
          import json
          import re
          import sys
          import unicodedata
          from datetime import datetime, timezone

          src, out = sys.argv[1:3]

          try:
              data = json.load(open(src, encoding="utf-8"))
          except Exception:
              raise SystemExit(1)

          posts = [
              item for item in data.get("results", [])
              if isinstance(item, dict)
              and item.get("type") == "status"
              and str(item.get("id", "")).isdigit()
          ]

          if not posts:
              raise SystemExit(1)

          post = max(posts, key=lambda item: int(item["id"]))
          post_id = str(post["id"])
          text = (post.get("text") or "").strip()
          created_ts = post.get("created_timestamp")

          if not created_ts:
              created_ts = ((int(post_id) >> 22) + 1288834974657) / 1000

          if created_ts > 10_000_000_000:
              created_ts = created_ts / 1000

          def normalizar(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(ch for ch in value if not unicodedata.combining(ch))
              return value.lower()

          base = normalizar(text)

          codigo = ["promo code", "redeem code", "codigo promocional", "codigo", " code "]
          evento = [
              "community day", "raid day", "research day", "hatch day",
              "spotlight hour", "raid hour", "go fest", "city safari",
              "safari zone", "event", "evento", "max battle day"
          ]
          atualizacao = [
              "update", "updated", "new feature", "feature update",
              "move update", "balance", "season", "temporada",
              "version", "versao", "mudanca", "changes"
          ]
          irrelevante = [
              "giveaway", "retweet", "repost", "follow me", "subscribe",
              "merch", "store", "meme", "personal post"
          ]
          pokemon = [
              "pokemon go", "pokemongo", "raid", "research", "pokestop", "gym",
              "trainer", "shadow", "mega", "dynamax", "gigantamax",
              "community day", "spotlight", "team go rocket", "zoroark",
              "zorua", "gbl", "battle league", "charmander", "pikachu"
          ]

          if any(term in base for term in codigo):
              categoria = "codigo"
          elif any(term in base for term in evento) or re.search(r"\bcd\b", base):
              categoria = "evento"
          elif any(term in base for term in atualizacao):
              categoria = "atualizacao"
          elif any(term in base for term in irrelevante) and not any(term in base for term in pokemon):
              categoria = "irrelevante"
          elif not any(term in base for term in pokemon):
              categoria = "irrelevante"
          else:
              categoria = "noticia"

          now = datetime.now(timezone.utc).timestamp()
          age_hours = max(0, (now - float(created_ts)) / 3600)

          result = {
              "id": post_id,
              "url": post.get("url") or f"https://x.com/g47ix/status/{post_id}",
              "categoria": categoria,
              "resumo": text[:900],
              "created_timestamp": int(float(created_ts)),
              "age_hours": round(age_hours, 2),
              "shiny": "shiny" in base or "brilhante" in base,
              "fonte": "FxTwitter timeline"
          }

          json.dump(result, open(out, "w", encoding="utf-8"), ensure_ascii=False)
          PY
          then
            SOURCE="fxtwitter"
          fi

          if [[ -z "$SOURCE" ]]; then
            echo "Timeline direta indisponível; usando busca pública de contingência."

            SEARCH_URL="https://html.duckduckgo.com/html/?q=site%3Ax.com%2Fg47ix%2Fstatus%20G47IX"

            curl \
              --location \
              --compressed \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 15 \
              --max-time 90 \
              --fail \
              --silent \
              --show-error \
              --user-agent "Mozilla/5.0" \
              --output "$DDG_FILE" \
              "$SEARCH_URL"

            python3 - "$DDG_FILE" "$META_FILE" <<'PY'
          import html
          import json
          import re
          import sys
          import unicodedata
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, unquote, urlparse

          html_path, meta_path = sys.argv[1:3]

          def limpar_url(href):
              href = html.unescape(href or "")
              if href.startswith("//"):
                  href = "https:" + href
              parsed = urlparse(href)
              if "duckduckgo.com" in parsed.netloc and parsed.path.startswith("/l/"):
                  target = parse_qs(parsed.query).get("uddg", [""])[0]
                  if target:
                      href = target
              return unquote(href)

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.results = []
                  self.current = None
                  self.capture = None
                  self.capture_tag = None

              def finish(self):
                  if not self.current:
                      return
                  self.current["title"] = " ".join(self.current.pop("title_parts", [])).strip()
                  self.current["snippet"] = " ".join(self.current.pop("snippet_parts", [])).strip()
                  self.results.append(self.current)
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  classes = data.get("class", "")
                  if tag == "a" and "result__a" in classes:
                      self.finish()
                      self.current = {
                          "href": limpar_url(data.get("href", "")),
                          "title_parts": [],
                          "snippet_parts": [],
                      }
                      self.capture = "title"
                      self.capture_tag = tag
                  elif self.current and "result__snippet" in classes:
                      self.capture = "snippet"
                      self.capture_tag = tag

              def handle_data(self, data):
                  if self.current and self.capture and data.strip():
                      self.current[f"{self.capture}_parts"].append(data.strip())

              def handle_endtag(self, tag):
                  if self.capture and tag == self.capture_tag:
                      if self.capture == "snippet":
                          self.finish()
                      self.capture = None
                      self.capture_tag = None

          raw = open(html_path, encoding="utf-8", errors="replace").read()
          parser = Parser()
          parser.feed(raw)
          parser.finish()

          encontrados = []
          for item in parser.results:
              joined = " ".join((item.get("href", ""), item.get("title", ""), item.get("snippet", "")))
              match = re.search(r"(?:https?://(?:www\.)?(?:x|twitter)\.com)?/g47ix/status/(\d{15,})", joined, flags=re.I)
              if match:
                  encontrados.append({**item, "id": match.group(1)})

          if not encontrados:
              raise SystemExit("Nenhuma publicacao G47IX encontrada")

          atual = max(encontrados, key=lambda item: int(item["id"]))
          post_id = atual["id"]
          text = " ".join(filter(None, (atual.get("title"), atual.get("snippet")))).strip()

          def normalizar(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(ch for ch in value if not unicodedata.combining(ch))
              return value.lower()

          base = normalizar(text)
          created_ts = ((int(post_id) >> 22) + 1288834974657) / 1000
          age_hours = max(0, (datetime.now(timezone.utc).timestamp() - created_ts) / 3600)

          if any(term in base for term in ["spotlight hour", "community day", "raid day", "research day", "event", "evento", "go fest"]):
              categoria = "evento"
          elif any(term in base for term in ["promo code", "redeem code", "codigo"]):
              categoria = "codigo"
          elif any(term in base for term in ["update", "updated", "season", "changes"]):
              categoria = "atualizacao"
          elif "pokemon" in base or "pokemongo" in base:
              categoria = "noticia"
          else:
              categoria = "irrelevante"

          json.dump({
              "id": post_id,
              "url": f"https://x.com/g47ix/status/{post_id}",
              "categoria": categoria,
              "resumo": text[:900],
              "created_timestamp": int(created_ts),
              "age_hours": round(age_hours, 2),
              "shiny": "shiny" in base or "brilhante" in base,
              "fonte": "DuckDuckGo fallback"
          }, open(meta_path, "w", encoding="utf-8"), ensure_ascii=False)
          PY
          fi

          POST_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$META_FILE")"
          POST_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$META_FILE")"
          CATEGORIA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["categoria"])' "$META_FILE")"
          RESUMO="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["resumo"])' "$META_FILE")"
          AGE_HOURS="$(python3 -c 'import json,sys; print(int(float(json.load(open(sys.argv[1]))["age_hours"])))' "$META_FILE")"
          SHINY="$(python3 -c 'import json,sys; print("sim" if json.load(open(sys.argv[1]))["shiny"] else "nao")' "$META_FILE")"
          FONTE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fonte"])' "$META_FILE")"

          echo "Fonte de coleta: $FONTE"
          echo "Publicacao localizada: $POST_URL"
          echo "Idade aproximada: ${AGE_HOURS}h"
          echo "Classificacao: $CATEGORIA"
          echo "Shiny mencionado: $SHINY"
          echo "Conteudo: ${RESUMO:0:700}"

          LAST_ID=""
          if [[ -f "$STATE_FILE" ]]; then
            LAST_ID="$(tr -cd '0-9' < "$STATE_FILE")"
          fi

          salvar_estado() {
            local mensagem="$1"
            printf '%s\n' "$POST_ID" > "$STATE_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$STATE_FILE"

            if git diff --cached --quiet; then
              return 0
            fi

            git commit -m "$mensagem"
            git pull --rebase origin main
            git push origin HEAD:main
          }

          if [[ -z "$LAST_ID" ]]; then
            echo "Primeira execucao: registrando sem publicar."
            salvar_estado "Spidey: inicializa controle G47IX"
            exit 0
          fi

          if (( POST_ID <= LAST_ID )); then
            echo "Nenhuma publicacao nova do G47IX."
            exit 0
          fi

          if (( AGE_HOURS > 48 )); then
            echo "Publicacao nova para o indice, mas antiga (${AGE_HOURS}h). Nao sera enviada."
            salvar_estado "Spidey: ignora publicacao G47IX antiga"
            exit 0
          fi

          if [[ "$CATEGORIA" == "irrelevante" ]]; then
            echo "Publicacao classificada como irrelevante. Nao sera enviada."
            salvar_estado "Spidey: ignora publicacao G47IX irrelevante"
            exit 0
          fi

          case "$CATEGORIA" in
            evento) ICONE="📅"; ROTULO="EVENTO" ;;
            codigo) ICONE="🎁"; ROTULO="CÓDIGO" ;;
            atualizacao) ICONE="🔄"; ROTULO="ATUALIZAÇÃO" ;;
            *) ICONE="📰"; ROTULO="NOTÍCIA" ;;
          esac

          if [[ "$DRY_RUN" == "1" ]]; then
            echo "Teste de atualização: publicação relevante encontrada, mas envio ao Discord foi bloqueado neste push."
            exit 0
          fi

          PAYLOAD="$(python3 - "$POST_URL" "$ICONE" "$ROTULO" "$RESUMO" "$SHINY" <<'PY'
          import json
          import sys

          url, icone, rotulo, resumo, shiny = sys.argv[1:6]
          shiny_line = "\n✨ Versão brilhante mencionada pela fonte." if shiny == "sim" else ""

          print(json.dumps({
              "titulo": f"{icone} G47IX • {rotulo}",
              "mensagem": (
                  f"**{resumo}**{shiny_line}\n\n"
                  f"🔗 Fonte original: {url}\n\n"
                  "🕷️ Detectado e classificado automaticamente pelo Spidey"
              )
          }, ensure_ascii=False))
          PY
          )"

          curl \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            "$SPIDEY"

          echo
          salvar_estado "Spidey: atualiza ultima publicacao G47IX"
