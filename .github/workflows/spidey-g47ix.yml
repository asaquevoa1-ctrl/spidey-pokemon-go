name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Testar Yahoo realtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --compressed --connect-timeout 15 --max-time 60 --fail --silent --show-error \
            -A "Mozilla/5.0" \
            "https://search.yahoo.co.jp/realtime/search?p=g47ix" \
            -o yahoo.html
          echo "Bytes: $(wc -c < yahoo.html)"
          grep -oE 'tweetId[^0-9]{0,20}[0-9]{15,}' yahoo.html | head -20 || true
          grep -oE '/status/[0-9]{15,}' yahoo.html | head -20 || true
          grep -ioE '.{0,120}g47ix.{0,300}' yahoo.html | head -20 || true
