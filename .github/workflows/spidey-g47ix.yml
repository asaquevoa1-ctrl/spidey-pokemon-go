name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Consultar fonte G47IX pelo Render
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://spidey-pokemon-go.onrender.com/check-g47ix-source"
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT

          CODE="$(curl \
            --connect-timeout 20 \
            --max-time 120 \
            --silent \
            --show-error \
            --output "$BODY" \
            --write-out '%{http_code}' \
            "$BASE")"

          echo "HTTP: $CODE"
          cat "$BODY"
          echo

          test "$CODE" = "200"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status")=="ok", data' < "$BODY"
