name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Diagnosticar fonte G47IX
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="https://twstalker.com/g47ix"
          HTML_FILE="$(mktemp)"
          trap 'rm -f "$HTML_FILE"' EXIT

          echo "Consultando G47IX via fonte alternativa..."

          curl \
            --location \
            --compressed \
            --retry 2 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 90 \
            --fail \
            --silent \
            --show-error \
            --header "Accept: text/html,application/xhtml+xml" \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
            --output "$HTML_FILE" \
            "$SOURCE"

          python3 - "$HTML_FILE" <<'PY'
          import html
          import re
          import sys

          path = sys.argv[1]
          text = open(path, encoding="utf-8", errors="replace").read()
          print("bytes:", len(text))

          pattern = re.compile(r'href=["\'](?:https?://[^"\']+)?/g47ix/status/(\d+)[^"\']*["\']', re.I)
          found = []
          for m in pattern.finditer(text):
              tweet_id = m.group(1)
              if tweet_id in {x[0] for x in found}:
                  continue
              start = max(0, m.start() - 1200)
              end = min(len(text), m.end() + 2200)
              snippet = text[start:end]
              snippet = re.sub(r'<script\b[^>]*>.*?</script>', ' ', snippet, flags=re.I | re.S)
              snippet = re.sub(r'<style\b[^>]*>.*?</style>', ' ', snippet, flags=re.I | re.S)
              snippet = re.sub(r'<[^>]+>', ' ', snippet)
              snippet = html.unescape(snippet)
              snippet = re.sub(r'\s+', ' ', snippet).strip()
              found.append((tweet_id, snippet[:900]))

          if not found:
              raise SystemExit("Nenhum status do G47IX encontrado na fonte alternativa")

          found.sort(key=lambda x: int(x[0]), reverse=True)
          print("IDs encontrados:", [x[0] for x in found[:10]])
          for tweet_id, snippet in found[:6]:
              print("---", tweet_id)
              print(snippet)
          PY
