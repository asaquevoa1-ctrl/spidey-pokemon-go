name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Buscar ultima publicacao G47IX
        shell: bash
        env:
          SPIDEY: https://spidey-pokemon-go.onrender.com/enviar
          STATE_FILE: last_g47ix.txt
        run: |
          set -euo pipefail

          SEARCH_URL="https://html.duckduckgo.com/html/?q=site%3Ax.com%2Fg47ix%2Fstatus%20G47IX"
          HTML_FILE="$(mktemp)"
          trap 'rm -f "$HTML_FILE"' EXIT

          echo "Consultando publicacoes do G47IX..."

          curl \
            --location \
            --compressed \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 90 \
            --fail \
            --silent \
            --show-error \
            --user-agent "Mozilla/5.0" \
            --output "$HTML_FILE" \
            "$SEARCH_URL"

          POST_ID="$(python3 - "$HTML_FILE" <<'PY'
          import re
          import sys
          from urllib.parse import unquote

          with open(sys.argv[1], encoding="utf-8", errors="replace") as source:
              text = unquote(source.read())

          ids = set(re.findall(
              r"(?:https?://(?:www\.)?(?:x|twitter)\.com)?/g47ix/status/(\d{15,})",
              text,
              flags=re.IGNORECASE,
          ))

          if not ids:
              raise SystemExit("Nenhuma publicacao G47IX encontrada na busca publica")

          print(max(ids, key=int))
          PY
          )"

          POST_URL="https://x.com/g47ix/status/$POST_ID"
          echo "Publicacao mais recente localizada: $POST_URL"

          LAST_ID=""
          if [[ -f "$STATE_FILE" ]]; then
            LAST_ID="$(tr -cd '0-9' < "$STATE_FILE")"
          fi

          salvar_estado() {
            local mensagem="$1"

            printf '%s\n' "$POST_ID" > "$STATE_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$STATE_FILE"

            if git diff --cached --quiet; then
              echo "Controle antirrepeticao ja esta atualizado."
              return 0
            fi

            git commit -m "$mensagem"

            for tentativa in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                return 0
              fi

              git rebase --abort 2>/dev/null || true
              echo "Nova tentativa de gravacao: $tentativa/3"
              sleep $((tentativa * 5))
            done

            echo "Nao foi possivel gravar $STATE_FILE no repositorio." >&2
            return 1
          }

          if [[ -z "$LAST_ID" ]]; then
            echo "Primeira execucao: registrando sem publicar."
            salvar_estado "Spidey: inicializa controle G47IX"
            exit 0
          fi

          if (( POST_ID <= LAST_ID )); then
            echo "Nenhuma publicacao nova do G47IX."
            exit 0
          fi

          echo "Nova publicacao G47IX encontrada!"

          PAYLOAD="$(python3 - "$POST_URL" <<'PY'
          import json
          import sys

          url = sys.argv[1]

          print(json.dumps({
              "titulo": "📊 Nova publicação G47IX",
              "mensagem": (
                  "Nova publicação detectada no G47IX.\n\n"
                  f"🔗 {url}\n\n"
                  "🕷️ Detectado automaticamente pelo Spidey"
              ),
          }, ensure_ascii=False))
          PY
          )"

          curl \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            "$SPIDEY"

          echo
          salvar_estado "Spidey: atualiza ultima publicacao G47IX"
