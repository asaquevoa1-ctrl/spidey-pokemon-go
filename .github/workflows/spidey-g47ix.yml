name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Buscar ultima publicacao G47IX
        shell: bash
        env:
          G47IX_TIMELINE: https://syndication.twitter.com/srv/timeline-profile/screen-name/g47ix
          SPIDEY: https://spidey-pokemon-go.onrender.com/enviar
          STATE_FILE: last_g47ix.txt
        run: |
          set -euo pipefail

          SOURCE_FILE="$(mktemp)"
          trap 'rm -f "$SOURCE_FILE"' EXIT

          echo "Consultando G47IX..."

          buscar_g47ix() {
            curl \
              --location \
              --compressed \
              --retry 3 \
              --retry-delay 5 \
              --retry-connrefused \
              --connect-timeout 15 \
              --max-time 60 \
              --fail \
              --silent \
              --show-error \
              --header "Accept: text/html,application/xhtml+xml" \
              --user-agent "Mozilla/5.0" \
              --output "$SOURCE_FILE" \
              "$G47IX_TIMELINE"

            python3 - "$SOURCE_FILE" <<'PY'
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8", errors="replace") as source:
              text = source.read()

          ids = set(re.findall(r'"entry_id"\s*:\s*"tweet-(\d+)"', text))
          ids.update(re.findall(r'"permalink"\s*:\s*"/g47ix/status/(\d+)"', text))

          if not ids:
              raise SystemExit("Timeline publica nao retornou publicacoes G47IX")

          latest = max(ids, key=int)
          print(f"https://x.com/g47ix/status/{latest}")
          PY
          }

          POST="$(buscar_g47ix)"
          echo "Fonte utilizada: timeline publica oficial do G47IX no X"

          echo "Publicacao mais recente: $POST"

          salvar_estado() {
            local mensagem="$1"

            printf '%s\n' "$POST" > "$STATE_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$STATE_FILE"

            if git diff --cached --quiet; then
              echo "Estado ja estava atualizado."
              return 0
            fi

            git commit -m "$mensagem"

            for tentativa in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                return 0
              fi

              git rebase --abort 2>/dev/null || true
              echo "Nova tentativa de gravacao: $tentativa/3"
              sleep $((tentativa * 5))
            done

            echo "Nao foi possivel gravar $STATE_FILE no repositorio." >&2
            return 1
          }

          LAST=""

          if [[ -f "$STATE_FILE" ]]; then
            LAST="$(tr -d '\r\n' < "$STATE_FILE")"
          fi

          if [[ -z "$LAST" || "$LAST" == "PENDING" ]]; then
            echo "Primeira execucao: registrando sem publicar."
            salvar_estado "Spidey: inicializa controle G47IX"
            exit 0
          fi

          if [[ "$POST" == "$LAST" ]]; then
            echo "Nenhuma publicacao nova."
            exit 0
          fi

          echo "Nova publicacao G47IX encontrada!"

          PAYLOAD="$(python3 - "$POST" <<'PY'
          import json
          import sys

          url = sys.argv[1]

          print(json.dumps({
              "titulo": "📊 Nova publicação G47IX",
              "mensagem": (
                  "Nova publicação detectada no G47IX.\n\n"
                  f"🔗 {url}\n\n"
                  "🕷️ Detectado automaticamente pelo Spidey"
              ),
          }, ensure_ascii=False))
          PY
          )"

          curl \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            --connect-timeout 20 \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            "$SPIDEY"

          salvar_estado "Spidey: atualiza ultima publicacao G47IX"
