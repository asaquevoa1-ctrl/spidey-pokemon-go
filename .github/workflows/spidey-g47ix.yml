name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Buscar ultima publicacao G47IX
        shell: bash
        env:
          INSTAGRAM_API: https://i.instagram.com/api/v1/users/web_profile_info/?username=g47ix
          JINA_READER: https://r.jina.ai/http://imginn.com/g47ix/
          IMG_INN: https://imginn.com/g47ix/
          SPIDEY: https://spidey-pokemon-go.onrender.com/enviar
          STATE_FILE: last_g47ix.txt
        run: |
          set -euo pipefail

          SOURCE_FILE="$(mktemp)"
          trap 'rm -f "$SOURCE_FILE"' EXIT

          echo "Consultando G47IX..."

          buscar_instagram() {
            curl \
              --location \
              --compressed \
              --retry 2 \
              --retry-delay 5 \
              --retry-connrefused \
              --connect-timeout 20 \
              --max-time 90 \
              --fail \
              --silent \
              --show-error \
              --header "Accept: application/json" \
              --header "Accept-Language: en-US,en;q=0.9" \
              --header "x-ig-app-id: 936619743392459" \
              --user-agent "Instagram 275.0.0.27.98 Android" \
              --output "$SOURCE_FILE" \
              "$INSTAGRAM_API"

            python3 - "$SOURCE_FILE" <<'PY'
          import json
          import re
          import sys

          ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
          VALUE = {char: index for index, char in enumerate(ALPHABET)}


          def shortcode_id(shortcode):
              number = 0

              for char in shortcode:
                  if char not in VALUE:
                      raise ValueError(f"Shortcode invalido: {shortcode}")

                  number = number * 64 + VALUE[char]

              return number


          with open(sys.argv[1], encoding="utf-8", errors="replace") as source:
              try:
                  data = json.load(source)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"Resposta Instagram invalida: {error}")

          user = data.get("data", {}).get("user") or {}
          shortcodes = []


          def collect(value):
              if isinstance(value, dict):
                  shortcode = value.get("shortcode") or value.get("code")

                  if isinstance(shortcode, str) and re.fullmatch(
                      r"[A-Za-z0-9_-]+", shortcode
                  ):
                      shortcodes.append(shortcode)

                  for child in value.values():
                      collect(child)

              elif isinstance(value, list):
                  for child in value:
                      collect(child)


          collect(user)
          shortcodes = list(dict.fromkeys(shortcodes))

          if not shortcodes:
              raise SystemExit("Instagram nao retornou publicacoes")

          latest = max(shortcodes, key=shortcode_id)
          print(f"https://www.instagram.com/p/{latest}/")
          PY
          }

          buscar_imginn() {
            curl \
              --location \
              --compressed \
              --retry 2 \
              --retry-delay 5 \
              --retry-connrefused \
              --connect-timeout 20 \
              --max-time 90 \
              --fail \
              --silent \
              --show-error \
              --user-agent "Mozilla/5.0" \
              --output "$SOURCE_FILE" \
              "$IMG_INN"

            python3 - "$SOURCE_FILE" <<'PY'
          import re
          import sys

          ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
          VALUE = {char: index for index, char in enumerate(ALPHABET)}


          def shortcode_id(shortcode):
              number = 0

              for char in shortcode:
                  if char not in VALUE:
                      raise ValueError(f"Shortcode invalido: {shortcode}")

                  number = number * 64 + VALUE[char]

              return number


          with open(sys.argv[1], encoding="utf-8", errors="replace") as source:
              html = source.read()

          pattern = re.compile(
              r'href\s*=\s*["\x27]'
              r'(?:https?://(?:www\.)?imginn\.com)?'
              r'/p/([A-Za-z0-9_-]+)'
              r'(?:/[^"\x27?#]*)?(?:[?#][^"\x27]*)?'
              r'["\x27]',
              re.IGNORECASE,
          )

          shortcodes = list(dict.fromkeys(pattern.findall(html)))

          if not shortcodes:
              raise SystemExit("Imginn nao retornou publicacoes")

          latest = max(shortcodes, key=shortcode_id)
          print(f"https://www.instagram.com/p/{latest}/")
          PY
          }

          buscar_jina() {
            curl \
              --location \
              --compressed \
              --retry 2 \
              --retry-delay 5 \
              --retry-connrefused \
              --connect-timeout 20 \
              --max-time 90 \
              --fail \
              --silent \
              --show-error \
              --header "Accept: text/plain" \
              --user-agent "Mozilla/5.0" \
              --output "$SOURCE_FILE" \
              "$JINA_READER"

            python3 - "$SOURCE_FILE" <<'PY'
          import re
          import sys

          ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
          VALUE = {char: index for index, char in enumerate(ALPHABET)}


          def shortcode_id(shortcode):
              number = 0

              for char in shortcode:
                  if char not in VALUE:
                      raise ValueError(f"Shortcode invalido: {shortcode}")

                  number = number * 64 + VALUE[char]

              return number


          with open(sys.argv[1], encoding="utf-8", errors="replace") as source:
              text = source.read()

          pattern = re.compile(
              r'(?:https?://(?:www\.)?(?:imginn|instagram)\.com)?'
              r'/(?:p|reels?)/([A-Za-z0-9_-]+)',
              re.IGNORECASE,
          )

          shortcodes = list(dict.fromkeys(pattern.findall(text)))

          if not shortcodes:
              raise SystemExit("Leitor nao retornou publicacoes")

          latest = max(shortcodes, key=shortcode_id)
          print(f"https://www.instagram.com/p/{latest}/")
          PY
          }

          if POST="$(buscar_instagram)"; then
            echo "Fonte utilizada: Instagram"
          elif POST="$(buscar_jina)"; then
            echo "Fonte utilizada: leitor publico"
          elif POST="$(buscar_imginn)"; then
            echo "Fonte utilizada: Imginn"
          else
            echo "Nenhuma fonte retornou publicacoes G47IX." >&2
            exit 1
          fi

          echo "Publicacao mais recente: $POST"

          salvar_estado() {
            local mensagem="$1"

            printf '%s\n' "$POST" > "$STATE_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$STATE_FILE"

            if git diff --cached --quiet; then
              echo "Estado ja estava atualizado."
              return 0
            fi

            git commit -m "$mensagem"

            for tentativa in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                return 0
              fi

              git rebase --abort 2>/dev/null || true
              echo "Nova tentativa de gravacao: $tentativa/3"
              sleep $((tentativa * 5))
            done

            echo "Nao foi possivel gravar $STATE_FILE no repositorio." >&2
            return 1
          }

          LAST=""

          if [[ -f "$STATE_FILE" ]]; then
            LAST="$(tr -d '\r\n' < "$STATE_FILE")"
          fi

          if [[ -z "$LAST" || "$LAST" == "PENDING" ]]; then
            echo "Primeira execucao: registrando sem publicar."
            salvar_estado "Spidey: inicializa controle G47IX"
            exit 0
          fi

          if [[ "$POST" == "$LAST" ]]; then
            echo "Nenhuma publicacao nova."
            exit 0
          fi

          echo "Nova publicacao G47IX encontrada!"

          PAYLOAD="$(python3 - "$POST" <<'PY'
          import json
          import sys

          url = sys.argv[1]

          print(json.dumps({
              "titulo": "📊 Nova publicação G47IX",
              "mensagem": (
                  "Nova publicação detectada no G47IX.\n\n"
                  f"🔗 {url}\n\n"
                  "🕷️ Detectado automaticamente pelo Spidey"
              ),
          }, ensure_ascii=False))
          PY
          )"

          curl \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            --connect-timeout 20 \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            "$SPIDEY"

          salvar_estado "Spidey: atualiza ultima publicacao G47IX"
