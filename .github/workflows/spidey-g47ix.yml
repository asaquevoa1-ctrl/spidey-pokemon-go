name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Testar buscas públicas G47IX
        shell: bash
        run: |
          set -euo pipefail

          testar() {
            NOME="$1"
            URL="$2"
            ARQ="$(mktemp)"
            CODE="$(curl -L --compressed --connect-timeout 15 --max-time 60 --silent --show-error \
              -A "Mozilla/5.0" -o "$ARQ" -w '%{http_code}' "$URL" || true)"
            echo "=== $NOME | HTTP $CODE | $(wc -c < "$ARQ") bytes ==="
            grep -oE 'https?://(x|twitter)\.com/g47ix/status/[0-9]+' "$ARQ" | sort -u | head -20 || true
            grep -oE '/g47ix/status/[0-9]+' "$ARQ" | sort -u | head -20 || true
            head -c 800 "$ARQ" | tr '\n' ' '
            echo
            rm -f "$ARQ"
          }

          testar "Bing RSS" "https://www.bing.com/search?q=site%3Ax.com%2Fg47ix%2Fstatus%20G47IX&format=rss"
          testar "Bing HTML" "https://www.bing.com/search?q=site%3Ax.com%2Fg47ix%2Fstatus%20G47IX"
          testar "DuckDuckGo" "https://html.duckduckgo.com/html/?q=site%3Ax.com%2Fg47ix%2Fstatus%20G47IX"
