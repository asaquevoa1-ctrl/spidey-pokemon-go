name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/spidey-g47ix.yml"

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Buscar e classificar ultima publicacao G47IX
        shell: bash
        env:
          SPIDEY: https://spidey-pokemon-go.onrender.com/enviar
          STATE_FILE: last_g47ix.txt
        run: |
          set -euo pipefail

          SEARCH_URL="https://html.duckduckgo.com/html/?q=site%3Ax.com%2Fg47ix%2Fstatus%20G47IX"
          HTML_FILE="$(mktemp)"
          META_FILE="$(mktemp)"
          trap 'rm -f "$HTML_FILE" "$META_FILE"' EXIT

          echo "Consultando publicacoes do G47IX..."

          curl \
            --location \
            --compressed \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 90 \
            --fail \
            --silent \
            --show-error \
            --user-agent "Mozilla/5.0" \
            --output "$HTML_FILE" \
            "$SEARCH_URL"

          python3 - "$HTML_FILE" "$META_FILE" <<'PY'
          import html
          import json
          import re
          import sys
          import unicodedata
          from urllib.parse import unquote

          html_path, meta_path = sys.argv[1:3]

          with open(html_path, encoding="utf-8", errors="replace") as source:
              raw = source.read()

          decoded = unquote(raw)

          ids = set(re.findall(
              r"(?:https?://(?:www\.)?(?:x|twitter)\.com)?/g47ix/status/(\d{15,})",
              decoded,
              flags=re.IGNORECASE,
          ))

          if not ids:
              raise SystemExit("Nenhuma publicacao G47IX encontrada na busca publica")

          post_id = max(ids, key=int)
          marker = f"/g47ix/status/{post_id}"
          pos = decoded.lower().find(marker.lower())

          if pos >= 0:
              start = max(0, pos - 2200)
              end = min(len(decoded), pos + 3200)
              window = decoded[start:end]
          else:
              window = decoded

          window = re.sub(r"<script\b[^>]*>.*?</script>", " ", window, flags=re.I | re.S)
          window = re.sub(r"<style\b[^>]*>.*?</style>", " ", window, flags=re.I | re.S)
          window = re.sub(r"<[^>]+>", " ", window)
          window = html.unescape(window)
          window = re.sub(r"\s+", " ", window).strip()

          def normalizar(texto):
              texto = unicodedata.normalize("NFKD", texto)
              texto = "".join(ch for ch in texto if not unicodedata.combining(ch))
              return texto.lower()

          base = normalizar(window)

          grupos = {
              "codigo": [
                  "promo code", "redeem code", "codigo promocional", "codigo", "code"
              ],
              "evento": [
                  "community day", "raid day", "research day", "hatch day",
                  "spotlight hour", "raid hour", "go fest", "city safari",
                  "safari zone", "event", "evento", "max battle day"
              ],
              "atualizacao": [
                  "update", "updated", "new feature", "feature update",
                  "move update", "balance", "season", "temporada",
                  "version", "versao", "mudanca", "changes"
              ],
          }

          irrelevante = [
              "giveaway", "retweet", "repost", "follow me", "subscribe",
              "merch", "store", "meme", "personal post"
          ]

          pokemon = [
              "pokemon go", "raid", "research", "pokestop", "gym",
              "trainer", "shadow", "mega", "dynamax", "gigantamax",
              "community day", "spotlight", "team go rocket"
          ]

          categoria = "noticia"

          if any(term in base for term in grupos["codigo"]):
              categoria = "codigo"
          elif any(term in base for term in grupos["evento"]):
              categoria = "evento"
          elif any(term in base for term in grupos["atualizacao"]):
              categoria = "atualizacao"
          elif any(term in base for term in irrelevante) and not any(term in base for term in pokemon):
              categoria = "irrelevante"
          elif not any(term in base for term in pokemon):
              categoria = "irrelevante"

          resumo = window[:700]

          data = {
              "id": post_id,
              "url": f"https://x.com/g47ix/status/{post_id}",
              "categoria": categoria,
              "resumo": resumo,
          }

          with open(meta_path, "w", encoding="utf-8") as output:
              json.dump(data, output, ensure_ascii=False)
          PY

          POST_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$META_FILE")"
          POST_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$META_FILE")"
          CATEGORIA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["categoria"])' "$META_FILE")"
          RESUMO="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["resumo"])' "$META_FILE")"

          echo "Publicacao mais recente: $POST_URL"
          echo "Classificacao: $CATEGORIA"
          echo "Trecho analisado: ${RESUMO:0:350}"

          LAST_ID=""
          if [[ -f "$STATE_FILE" ]]; then
            LAST_ID="$(tr -cd '0-9' < "$STATE_FILE")"
          fi

          salvar_estado() {
            local mensagem="$1"

            printf '%s\n' "$POST_ID" > "$STATE_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$STATE_FILE"

            if git diff --cached --quiet; then
              echo "Controle antirrepeticao ja esta atualizado."
              return 0
            fi

            git commit -m "$mensagem"

            for tentativa in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                return 0
              fi

              git rebase --abort 2>/dev/null || true
              echo "Nova tentativa de gravacao: $tentativa/3"
              sleep $((tentativa * 5))
            done

            echo "Nao foi possivel gravar $STATE_FILE no repositorio." >&2
            return 1
          }

          if [[ -z "$LAST_ID" ]]; then
            echo "Primeira execucao: registrando sem publicar."
            salvar_estado "Spidey: inicializa controle G47IX"
            exit 0
          fi

          if (( POST_ID <= LAST_ID )); then
            echo "Nenhuma publicacao nova do G47IX."
            exit 0
          fi

          if [[ "$CATEGORIA" == "irrelevante" ]]; then
            echo "Publicacao nova classificada como irrelevante. Nao sera enviada ao Discord."
            salvar_estado "Spidey: ignora publicacao G47IX irrelevante"
            exit 0
          fi

          case "$CATEGORIA" in
            evento)
              ICONE="📅"
              ROTULO="EVENTO"
              ;;
            codigo)
              ICONE="🎁"
              ROTULO="CÓDIGO"
              ;;
            atualizacao)
              ICONE="🔄"
              ROTULO="ATUALIZAÇÃO"
              ;;
            *)
              ICONE="📰"
              ROTULO="NOTÍCIA"
              ;;
          esac

          echo "Nova publicacao relevante do G47IX encontrada: $ROTULO"

          PAYLOAD="$(python3 - "$POST_URL" "$ICONE" "$ROTULO" <<'PY'
          import json
          import sys

          url, icone, rotulo = sys.argv[1:4]

          print(json.dumps({
              "titulo": f"{icone} G47IX • {rotulo}",
              "mensagem": (
                  f"Nova publicação classificada como **{rotulo}**.\n\n"
                  f"🔗 {url}\n\n"
                  "🕷️ Detectado e classificado automaticamente pelo Spidey"
              ),
          }, ensure_ascii=False))
          PY
          )"

          curl \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 120 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            "$SPIDEY"

          echo
          salvar_estado "Spidey: atualiza ultima publicacao G47IX"
