name: Spidey - checar G47IX

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-g47ix-check
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Buscar ultima publicacao G47IX
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="https://imginn.com/g47ix/"
          SPIDEY="https://spidey-pokemon-go.onrender.com/enviar"

          echo "Consultando G47IX..."

          HTML="$(curl             --retry 3             --retry-delay 10             --max-time 120             --fail             --silent             --show-error             -A "Mozilla/5.0"             "$PROFILE")"

          POST="$(python -c '
          import re, sys
          html = sys.stdin.read()

          links = re.findall(r"href=[\"\x27](/p/[^\"\x27]+/?)[\"\x27]", html)

          if not links:
              raise SystemExit("Nenhuma publicacao G47IX encontrada")

          print("https://imginn.com" + links[0])
          ' <<< "$HTML")"

          echo "Publicacao encontrada:"
          echo "$POST"

          if [ ! -f last_g47ix.txt ]; then
            echo "Primeira execução: registrando sem publicar."

            printf '%s\n' "$POST" > last_g47ix.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add last_g47ix.txt
            git commit -m "Spidey: inicializa controle G47IX"
            git push

            exit 0
          fi

          LAST="$(tr -d '\r\n' < last_g47ix.txt)"

          if [ "$POST" = "$LAST" ]; then
            echo "Nenhuma publicação nova."
            exit 0
          fi

          echo "Nova publicação G47IX encontrada!"

          curl             --retry 3             --retry-delay 10             --max-time 120             --fail             --silent             --show-error             -X POST             -H "Content-Type: application/json"             "$SPIDEY"             --data "$(python -c '
          import json, sys

          url = sys.argv[1]

          print(json.dumps({
              "titulo": "📊 Nova publicação G47IX",
              "mensagem":
                  "Nova publicação detectada no G47IX.\n\n"
                  "🔗 " + url + "\n\n"
                  "🕷️ Detectado automaticamente pelo Spidey"
          }))
          ' "$POST")"

          printf '%s\n' "$POST" > last_g47ix.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_g47ix.txt
          git commit -m "Spidey: atualiza ultima publicacao G47IX"
          git push
