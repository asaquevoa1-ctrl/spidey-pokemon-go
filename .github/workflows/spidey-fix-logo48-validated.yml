name: Spidey - aplicar logo oficial validado

on:
  push:
    branches: [main]
    paths: [".github/workflows/spidey-fix-logo48-validated.yml"]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - run: python -m pip install -r requirements.txt
      - name: Aplicar e validar logo oficial
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,hashlib,io
          raw=Path('assets/spidey-logo-oficial-48.b64').read_text(encoding='utf-8').strip()
          b=base64.b64decode(raw,validate=True)
          assert hashlib.sha256(b).hexdigest()=='0d9e80a13b430743b4a7e4a5ec2970285df5cd1324f26ab89ab7a27e3d79a4f4'
          im=Image.open(io.BytesIO(b)); im.load(); assert im.size==(48,48)

          p=Path('spidey_art_v4.py')
          s=p.read_text(encoding='utf-8')
          if 'import base64\n' not in s:
              s=s.replace('import io\n','import io\nimport base64\n',1)
          start=s.index('def _logo_oficial():')
          end=s.index('\n\ndef _aplicar_logo_oficial',start)
          helper='''def _logo_oficial():\n    try:\n        raw = Path("assets/spidey-logo-oficial-48.b64").read_text(encoding="utf-8").strip()\n        return Image.open(io.BytesIO(base64.b64decode(raw, validate=True))).convert("RGBA")\n    except Exception:\n        return None\n'''
          s=s[:start]+helper+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile spidey_art_v4.py
          python - <<'PY'
          import spidey_art_v4 as art
          logo=art._logo_oficial(); assert logo is not None; assert logo.size==(48,48),logo.size
          card=art.criar_card('📰 NOTÍCIA • TESTE LOGO','Validação final do logo oficial do Spidey. Fonte oficial: Pokémon GO.')
          assert len(card)>50000,len(card)
          print('LOGO_OFICIAL_NO_GERADOR_OK',logo.size)
          print('CARD_GERADO_COM_LOGO_OK',len(card))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spidey_art_v4.py
          git commit -m "Spidey: usar logo oficial validado no gerador"
          git pull --rebase origin main
          git push origin HEAD:main
