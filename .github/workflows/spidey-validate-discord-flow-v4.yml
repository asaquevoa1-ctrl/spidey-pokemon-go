name: Spidey - validar fluxo Discord v4

on:
  push:
    branches: [main]
    paths: [".github/workflows/spidey-validate-discord-flow-v4.yml"]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      APPROVAL_CHANNEL_ID: "1550963072464715997"
      SPIDEY_ENDPOINT: "https://spidey-pokemon-go.onrender.com/enviar"
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install -r requirements.txt

      - name: Validar logo e fallback
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bot.py spidey_art_v4.py
          python - <<'PY'
          import spidey_art_v4 as art
          logo=art._logo_oficial()
          assert logo is not None, 'Logo oficial não carregou'
          assert logo.size == (128,128), logo.size
          card=art.criar_card('📰 NOTÍCIA • TESTE','Teste do Spidey. Fonte oficial: Pokémon GO.')
          assert len(card)>50000, len(card)
          print('LOGO_OFICIAL_OK',logo.size)
          print('ARTE_FALLBACK_OK',len(card))
          PY

      - name: Testar um único disparo no Discord
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,time,requests
          token=os.environ['DISCORD_BOT_TOKEN'].strip(); cid=os.environ['APPROVAL_CHANNEL_ID']; endpoint=os.environ['SPIDEY_ENDPOINT']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          def msgs():
              r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':50},timeout=30); r.raise_for_status(); return r.json()
          before={m['id'] for m in msgs()}
          payload={
            'titulo':'🧪 TESTE FLUXO DISCORD V4',
            'mensagem':'Validação técnica do Spidey.\n\n📌 Fonte: teste interno.\n🕷️ Esta mensagem será removida automaticamente.',
            'url':None,'gerar_gpx':False,'gerar_arte':True,'usar_premium':False,'permitir_fallback':True,'aprovar':True,
          }
          r=requests.post(endpoint,json=payload,timeout=180)
          print('SPIDEY_HTTP',r.status_code); print('SPIDEY_RESPONSE',r.text[:800]); r.raise_for_status()
          data=r.json(); assert data.get('status')=='enviado' and data.get('etapa')=='aguardando_aprovacao' and data.get('arte') is True, data
          time.sleep(3)
          new=[m for m in msgs() if m['id'] not in before]
          tests=[]
          for m in new:
              e=(m.get('embeds') or [{}])[0]; text=((e.get('title') or '')+' '+(e.get('description') or '')).upper()
              if 'TESTE FLUXO DISCORD V4' in text: tests.append(m)
          assert len(tests)==1, f'Esperava 1 card; encontrei {len(tests)}; novas={[m["id"] for m in new]}'
          m=tests[0]; e=(m.get('embeds') or [{}])[0]; desc=e.get('description') or ''
          assert 'APROVAR' in desc and 'REPROVAR' in desc, desc
          extra=[x for x in new if 'DECIDA ABAIXO' in (x.get('content') or '').upper()]
          assert not extra, [x['id'] for x in extra]
          img=(e.get('image') or {}).get('proxy_url') or (e.get('image') or {}).get('url') or ''
          assert img and not img.startswith('attachment://'), img
          ir=requests.get(img,timeout=30); ir.raise_for_status(); assert ir.headers.get('content-type','').startswith('image/') and len(ir.content)>50000
          reject=re.search(r'\[REPROVAR\]\((https?://[^)]+)\)',desc,re.I); assert reject,desc
          rr=requests.get(reject.group(1),timeout=30); print('REJECT_HTTP',rr.status_code); rr.raise_for_status(); assert 'rejeitada' in rr.text.lower()
          print('DISCORD_ONE_MESSAGE_OK'); print('DISCORD_IMAGE_OK',len(ir.content)); print('DISCORD_LINKS_OK'); print('TEST_MESSAGE',m['id'])
          dr=requests.delete(f'https://discord.com/api/v10/channels/{cid}/messages/{m["id"]}',headers=h,timeout=30); print('CLEANUP_HTTP',dr.status_code)
          PY

      - name: Validar aprovação de arte fallback sem publicar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import bot
          from spidey_approval import criar_token
          sent=[]
          bot._whapi_configurado=lambda:False
          bot.mandar_discord=lambda *a,**k:sent.append((a,k))
          bot.mandar_coordenadas_cruas=lambda *a,**k:None
          bot.tokens_processados.clear(); bot._segredo_aprovacao=lambda:'teste-seguro-spidey'
          dados={'titulo':'🧪 FALLBACK','mensagem':'Teste de aprovação fallback.','url':None,'coordenadas':[],'gerar_gpx':False,'gpx_nome':'x.gpx','gerar_arte':True,'usar_premium':False,'permitir_fallback':True,'imagem_url':None}
          tok=criar_token(dados,'teste-seguro-spidey')
          resp=bot.app.test_client().get('/aprovar?t='+tok)
          print('APROVAR_LOCAL_HTTP',resp.status_code); assert resp.status_code==200,resp.data[:500]; assert sent
          print('APROVACAO_FALLBACK_OK')
          PY
