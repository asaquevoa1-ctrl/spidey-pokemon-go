name: Spidey - verificar alertas Cloudflare
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/spidey-push-dispatch.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-push-dispatch.yml"
permissions:
  contents: read
concurrency:
  group: spidey-push-health-watch
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar status publico sem acionar envios
        shell: bash
        env:
          PUSH_BASE: https://spidey-push.spursander.workers.dev
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          base = os.environ['PUSH_BASE'].rstrip('/')
          headers = {'User-Agent':'Spidey-public-health-probe/1.0','Cache-Control':'no-cache'}
          def read(path):
              request = urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path} returned {response.status}')
                  return json.load(response)
          health = read('/health')
          public_key = read('/api/push/public-key')
          scheduler = health.get('push',{}).get('scheduler') or {}
          enabled = health.get('push',{}).get('available') is True
          key = isinstance(public_key.get('publicKey'),str) and bool(public_key['publicKey'])
          checked = scheduler.get('checked_at')
          age = float('inf')
          if checked:
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(checked.replace('Z','+00:00'))).total_seconds()
          print(json.dumps({'service_reachable':True,'push_enabled':enabled,
              'public_key_available':key,'cron_status':scheduler.get('status'),
              'cron_age_seconds':round(age) if age!=float('inf') else None}))
          if not (enabled and key and scheduler.get('status')=='ok' and -60<=age<=2700):
              raise SystemExit('Alertas Cloudflare nao saudaveis')
          PY
