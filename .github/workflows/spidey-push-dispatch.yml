name: Spidey App - verificar serviço de alertas
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-push-dispatch.yml"
      - "config/spidey-backend.json"
      - "services/spidey-backend/**"
      - "scripts/check_spidey_backend.py"
permissions:
  contents: read
concurrency:
  group: spidey-push-health
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Conferir apenas saúde e disponibilidade públicas
        run: python scripts/check_spidey_backend.py
# Delivery belongs to the Workers cron. This workflow never dispatches push.
