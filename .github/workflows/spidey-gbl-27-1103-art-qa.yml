name: Spidey - QA responsivo GBL Halloween
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/gbl-20261027-1103-v1.png'
      - 'spidey-app/assets/events/premium/gbl-20261027-1103-approved-v1.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'docs/qa/GBL_27_1103_ART_*.json'
      - 'tests/gbl-27-1103-art-approval.test.cjs'
      - 'scripts/qa_gbl_27_1103_art_browser.mjs'
      - '.github/workflows/spidey-gbl-27-1103-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/gbl-27-1103-art
          command -v google-chrome | tee test-results/gbl-27-1103-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_gbl_27_1103_art_browser.mjs 2>&1 | tee test-results/gbl-27-1103-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbl-27-1103-responsive-preview
          path: test-results/gbl-27-1103-art
