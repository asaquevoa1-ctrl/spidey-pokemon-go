name: Spidey - instalar motor oficial de arte

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-install-official-art-engine.yml"
      - "scripts/patch_official_art_engine.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar motor oficial
        run: python scripts/patch_official_art_engine.py

      - name: Validar codigo e logo oficial
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt
          python -m py_compile bot.py premium_art.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/spidey-logo-oficial.jpg')
          im=Image.open(p)
          im.verify()
          print('LOGO_OFICIAL_VALIDO', p.stat().st_size)
          PY

      - name: Salvar alteracoes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py premium_art.py
          if git diff --cached --quiet; then
            echo "Motor oficial ja aplicado."
            exit 0
          fi
          git commit -m "Spidey: instalar motor visual oficial sem fallback"
          git pull --rebase origin main
          git push origin HEAD:main
