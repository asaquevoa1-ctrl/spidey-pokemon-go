name: Spidey - QA responsivo City Safari Boston
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/city-safari-boston-20261024-25-v1.png'
      - 'spidey-app/assets/events/premium/city-safari-boston-20261024-25-approved-v1.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'docs/qa/CITY_SAFARI_BOSTON_ART_*.json'
      - 'tests/city-safari-boston-art-approval.test.cjs'
      - 'scripts/qa_city_safari_boston_art_browser.mjs'
      - '.github/workflows/spidey-city-safari-boston-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/city-safari-boston-art
          command -v google-chrome | tee test-results/city-safari-boston-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_city_safari_boston_art_browser.mjs 2>&1 | tee test-results/city-safari-boston-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-safari-boston-responsive-preview
          path: test-results/city-safari-boston-art
