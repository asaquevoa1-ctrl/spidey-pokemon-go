name: Spidey - inspecionar encaminhamento Discord

on:
  push:
    branches: [spidey-assets]
    paths:
      - ".github/workflows/spidey-inspect-forward.yml"

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler mensagens recentes de entrada-discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: "1550962861998866564"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['DISCORD_BOT_TOKEN'].strip(); cid=os.environ['CHANNEL_ID']
          req=urllib.request.Request(
              f'https://discord.com/api/v10/channels/{cid}/messages?limit=5',
              headers={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0','Accept':'application/json'}
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              msgs=json.loads(r.read().decode())
          print('TOTAL',len(msgs))
          for m in msgs:
              print('---')
              print('ID',m.get('id'),'TYPE',m.get('type'),'AUTHOR', (m.get('author') or {}).get('username'))
              print('CONTENT',repr(str(m.get('content') or '')[:1000]))
              print('ATTACHMENTS',[(a.get('filename'),a.get('content_type'),a.get('url')) for a in (m.get('attachments') or [])])
              print('EMBEDS',[(e.get('title'),str(e.get('description') or '')[:700],e.get('url'),(e.get('image') or {}).get('url')) for e in (m.get('embeds') or [])])
              snaps=m.get('message_snapshots') or []
              print('SNAPSHOTS',len(snaps))
              for s in snaps[:3]:
                  sm=s.get('message') or s
                  print('SNAP_CONTENT',repr(str(sm.get('content') or '')[:1400]))
                  print('SNAP_ATTACHMENTS',[(a.get('filename'),a.get('content_type'),a.get('url')) for a in (sm.get('attachments') or [])])
                  print('SNAP_EMBEDS',[(e.get('title'),str(e.get('description') or '')[:700],e.get('url'),(e.get('image') or {}).get('url')) for e in (sm.get('embeds') or [])])
          PY
