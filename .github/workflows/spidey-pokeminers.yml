name: Spidey - monitor PokeMiners

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/spidey-pokeminers.yml"

permissions:
  contents: write

concurrency:
  group: spidey-pokeminers-monitor
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      POKEMINERS_CHANNEL_ID: "1550962794814373898"
      POKEMINERS_CHANNEL_NAME: "📥・entrada-pokeminers"
      SPIDEY_ENDPOINT: https://spidey-pokemon-go.onrender.com/enviar
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Ler PokeMiners e enviar novidades
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          token = os.getenv("DISCORD_BOT_TOKEN", "").strip()
          channel_id = os.getenv("POKEMINERS_CHANNEL_ID", "").strip()
          channel_name = os.getenv("POKEMINERS_CHANNEL_NAME", "entrada-pokeminers").strip()
          endpoint = os.getenv("SPIDEY_ENDPOINT", "").strip()
          state_file = Path("last_pokeminers.txt")

          if not token:
              print("PokeMiners monitor aguardando configuração: DISCORD_BOT_TOKEN.")
              raise SystemExit(0)

          def request_json(url, method="GET", payload=None, headers=None, timeout=60):
              body = None
              final_headers = dict(headers or {})
              if payload is not None:
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  final_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, method=method, headers=final_headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", errors="replace")
                  print(f"HTTP {e.code}: {raw[:800]}", file=sys.stderr)
                  raise

          discord_headers = {"Authorization": f"Bot {token}"}

          def canonical_channel_name(value):
              normalized = unicodedata.normalize("NFKD", str(value or ""))
              ascii_name = normalized.encode("ascii", "ignore").decode("ascii").lower()
              return re.sub(r"[^a-z0-9]+", "-", ascii_name).strip("-")

          def discover_channel_id():
              status, guilds = request_json(
                  "https://discord.com/api/v10/users/@me/guilds?limit=200",
                  headers=discord_headers,
                  timeout=30,
              )
              if status != 200 or not isinstance(guilds, list):
                  raise RuntimeError("Discord não retornou a lista de servidores do bot.")

              target = canonical_channel_name(channel_name)
              matches = []
              for guild in guilds:
                  guild_id = str(guild.get("id") or "").strip()
                  if not guild_id:
                      continue
                  try:
                      _, channels = request_json(
                          f"https://discord.com/api/v10/guilds/{guild_id}/channels",
                          headers=discord_headers,
                          timeout=30,
                      )
                  except urllib.error.HTTPError:
                      print(f"Aviso: sem acesso aos canais do servidor {guild_id}.", file=sys.stderr)
                      continue
                  if not isinstance(channels, list):
                      continue
                  for channel in channels:
                      if channel.get("type") not in (0, 5):
                          continue
                      if canonical_channel_name(channel.get("name")) == target:
                          matches.append({
                              "id": str(channel.get("id") or ""),
                              "name": str(channel.get("name") or ""),
                              "guild_id": guild_id,
                              "guild_name": str(guild.get("name") or guild_id),
                          })

              if not matches:
                  raise RuntimeError(
                      f"Canal '{channel_name}' não localizado. "
                      "Confirme que o bot está no servidor e pode visualizar o canal."
                  )
              if len(matches) > 1:
                  found = ", ".join(f"{item['guild_name']}:{item['id']}" for item in matches)
                  raise RuntimeError(
                      "Mais de um canal PokeMiners foi localizado. "
                      f"Configure POKEMINERS_CHANNEL_ID para escolher um: {found}"
                  )

              match = matches[0]
              print(
                  "Canal PokeMiners localizado automaticamente: "
                  f"{match['name']} ({match['id']}) em {match['guild_name']}."
              )
              return match["id"]

          if not channel_id:
              channel_id = discover_channel_id()

          status, channel_meta = request_json(
              f"https://discord.com/api/v10/channels/{channel_id}",
              headers=discord_headers,
              timeout=30,
          )
          if status != 200 or not isinstance(channel_meta, dict):
              raise RuntimeError("Discord não retornou os dados do canal PokeMiners.")
          channel_guild_id = str(channel_meta.get("guild_id") or "").strip()

          status, messages = request_json(
              f"https://discord.com/api/v10/channels/{channel_id}/messages?limit=50",
              headers=discord_headers,
              timeout=30,
          )
          if status != 200 or not isinstance(messages, list):
              raise RuntimeError("Discord não retornou mensagens válidas.")

          last_id = state_file.read_text(encoding="utf-8").strip() if state_file.exists() else ""

          def full_text(msg):
              parts = []
              content = str(msg.get("content") or "").strip()
              if content:
                  parts.append(content)
              for embed in msg.get("embeds") or []:
                  for key in ("title", "description"):
                      value = str(embed.get(key) or "").strip()
                      if value:
                          parts.append(value)
                  for field in embed.get("fields") or []:
                      name = str(field.get("name") or "").strip()
                      value = str(field.get("value") or "").strip()
                      if name or value:
                          parts.append(" — ".join(x for x in (name, value) if x))
              return "\n\n".join(parts).strip()

          if messages and not any(full_text(msg) for msg in messages):
              raise RuntimeError(
                  "Discord retornou mensagens sem conteúdo. "
                  "Ative o Message Content Intent do bot no Discord Developer Portal."
              )

          def is_pokeminers(msg, text):
              author = msg.get("author") or {}
              author_text = " ".join([
                  str(author.get("username") or ""),
                  str(author.get("global_name") or ""),
              ]).lower()
              probe = author_text + " " + text.lower()
              return any(x in probe for x in ("pokeminers", "miner-bot", "@apk updates", "@forced updates"))

          def relevant(text):
              t = text.lower()
              markers = (
                  "api version", "forced update", "apk update", "@apk updates",
                  "@forced updates", "game master", "gamemaster", "master file",
                  "asset update", "text update", "remote config", "new version",
                  "version changed", "forced updates", "datamine", "data mine",
              )
              return any(m in t for m in markers)

          def classify(text):
              t = text.lower()
              if "forced update" in t or "api version" in t or "version changed" in t:
                  return "⚙️ ATUALIZAÇÃO • Pokémon GO"
              if "apk" in t:
                  return "📦 APK • Pokémon GO"
              if "game master" in t or "gamemaster" in t or "datamine" in t or "data mine" in t:
                  return "🔎 DATAMINE • PokeMiners"
              return "⛏️ POKEMINERS • Nova atualização"

          def normalize_message(text):
              compact = re.sub(r"\n{3,}", "\n\n", text).strip()
              m = re.search(r"(?:api version changed.*?|forced update.*?)(\d+\.\d+\.\d+)\s*(?:->|→)\s*(\d+\.\d+\.\d+)", compact, re.I | re.S)
              if m:
                  old, new = m.group(1), m.group(2)
                  return (
                      "O PokeMiners detectou uma atualização forçada da API do Pokémon GO.\n\n"
                      f"📦 Versão anterior: {old}\n"
                      f"🆕 Nova versão: {new}\n"
                      "⚠️ Tipo: atualização forçada"
                  )
              if len(compact) > 3200:
                  compact = compact[:3197].rstrip() + "..."
              return "Nova informação detectada automaticamente no PokeMiners.\n\n" + compact

          def parse_ts(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except Exception:
                  return None

          unseen = []
          for msg in messages:
              mid = str(msg.get("id") or "").strip()
              if not mid:
                  continue
              if last_id and mid == last_id:
                  break
              text = full_text(msg)
              if text and is_pokeminers(msg, text) and relevant(text):
                  unseen.append((msg, text))

          if not unseen:
              print("Nenhuma nova atualização relevante do PokeMiners.")
              raise SystemExit(0)

          if not last_id:
              cutoff = datetime.now(timezone.utc) - timedelta(hours=12)
              recent = [(m, t) for m, t in unseen if (parse_ts(m.get("timestamp")) or cutoff) >= cutoff]
              unseen = recent[:1] if recent else unseen[:1]
          else:
              unseen = list(reversed(unseen))[:5]

          newest_sent_id = None
          for msg, text in unseen:
              mid = str(msg.get("id") or "").strip()
              source_url = (
                  f"https://discord.com/channels/{channel_guild_id}/{channel_id}/{mid}"
                  if channel_guild_id else None
              )
              payload = {
                  "titulo": classify(text),
                  "mensagem": normalize_message(text) + "\n\n🔎 Fonte operacional: PokeMiners #miner-bot\n🕷️ Aguardando sua aprovação antes da publicação.",
                  "url": source_url,
                  "gerar_gpx": False,
                  "gerar_arte": False,
                  "aprovar": True,
              }
              _, data = request_json(endpoint, method="POST", payload=payload, timeout=120)
              if data.get("status") != "enviado" or data.get("etapa") != "aguardando_aprovacao":
                  raise RuntimeError("Resposta inesperada do Spidey: " + json.dumps(data, ensure_ascii=False))
              print(f"OK: PokeMiners {mid} enviado para aprovação.")
              newest_sent_id = mid

          if newest_sent_id:
              state_file.write_text(newest_sent_id + "\n", encoding="utf-8")
          PY

      - name: Salvar antirrepetição
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f last_pokeminers.txt ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_pokeminers.txt
          if ! git diff --cached --quiet; then
            git commit -m "Spidey: atualiza controle PokeMiners"
            git push origin HEAD:main
          fi
