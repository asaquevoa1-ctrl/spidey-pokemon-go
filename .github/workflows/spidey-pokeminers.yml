name: Spidey - monitor PokeMiners

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-pokeminers.yml"

permissions:
  contents: write

concurrency:
  group: spidey-pokeminers-monitor
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      POKEMINERS_CHANNEL_ID: "1550962794814373898"
      SPIDEY_ENDPOINT: "https://spidey-pokemon-go.onrender.com/enviar"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Ler PokeMiners e enviar novidades
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          from pathlib import Path

          token = os.getenv("DISCORD_BOT_TOKEN", "").strip()
          channel_id = os.getenv("POKEMINERS_CHANNEL_ID", "").strip()
          endpoint = os.getenv("SPIDEY_ENDPOINT", "").strip()
          state_file = Path("last_pokeminers.txt")

          if not token:
              raise RuntimeError("DISCORD_BOT_TOKEN não configurado.")

          discord_headers = {
              "Authorization": f"Bot {token}",
              "User-Agent": "DiscordBot (https://github.com/asaquevoa1-ctrl/spidey-pokemon-go, 1.0)",
              "Accept": "application/json",
          }

          def request_json(url, method="GET", payload=None, headers=None, timeout=60):
              body = None
              final_headers = dict(headers or {})
              final_headers.setdefault("User-Agent", "SpideyPokemonGO/1.0")
              final_headers.setdefault("Accept", "application/json")
              if payload is not None:
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  final_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, method=method, headers=final_headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  print(f"HTTP {exc.code}: {raw[:1000]}", file=sys.stderr)
                  raise

          status, channel = request_json(
              f"https://discord.com/api/v10/channels/{channel_id}",
              headers=discord_headers,
              timeout=30,
          )
          if status != 200:
              raise RuntimeError("Falha ao acessar canal PokeMiners.")

          guild_id = str(channel.get("guild_id") or "").strip()
          print(f"OK: bot acessou o canal {channel.get('name', channel_id)}.")

          status, messages = request_json(
              f"https://discord.com/api/v10/channels/{channel_id}/messages?limit=50",
              headers=discord_headers,
              timeout=30,
          )
          if status != 200 or not isinstance(messages, list):
              raise RuntimeError("Discord não retornou mensagens válidas.")

          def full_text(msg):
              parts = []
              content = str(msg.get("content") or "").strip()
              if content:
                  parts.append(content)
              for embed in msg.get("embeds") or []:
                  for key in ("title", "description"):
                      value = str(embed.get(key) or "").strip()
                      if value:
                          parts.append(value)
                  for field in embed.get("fields") or []:
                      name = str(field.get("name") or "").strip()
                      value = str(field.get("value") or "").strip()
                      if name or value:
                          parts.append(" — ".join(x for x in (name, value) if x))
              return "\n\n".join(parts).strip()

          if messages and not any(full_text(m) for m in messages):
              raise RuntimeError("Mensagens sem conteúdo: ative Message Content Intent no bot.")

          def is_pokeminers(msg, text):
              author = msg.get("author") or {}
              probe = " ".join([
                  str(author.get("username") or ""),
                  str(author.get("global_name") or ""),
                  text,
              ]).lower()
              return any(x in probe for x in ("pokeminers", "miner-bot", "@apk updates", "@forced updates"))

          def relevant(text):
              t = text.lower()
              markers = (
                  "api version", "forced update", "apk update", "@apk updates",
                  "@forced updates", "game master", "gamemaster", "master file",
                  "asset update", "text update", "remote config", "new version",
                  "version changed", "datamine", "data mine",
              )
              return any(m in t for m in markers)

          def classify(text):
              t = text.lower()
              if "forced update" in t or "api version" in t or "version changed" in t:
                  return "⚙️ ATUALIZAÇÃO • Pokémon GO"
              if "apk" in t:
                  return "📦 APK • Pokémon GO"
              if "game master" in t or "gamemaster" in t or "datamine" in t or "data mine" in t:
                  return "🔎 DATAMINE • PokeMiners"
              return "⛏️ POKEMINERS • Nova atualização"

          def normalize(text):
              compact = re.sub(r"\n{3,}", "\n\n", text).strip()
              match = re.search(
                  r"(?:api version changed.*?|forced update.*?)(\d+\.\d+\.\d+)\s*(?:->|→)\s*(\d+\.\d+\.\d+)",
                  compact,
                  re.I | re.S,
              )
              if match:
                  old, new = match.group(1), match.group(2)
                  return (
                      "O PokeMiners detectou uma atualização forçada da API do Pokémon GO.\n\n"
                      f"📦 Versão anterior: {old}\n"
                      f"🆕 Nova versão: {new}\n"
                      "⚠️ Tipo: atualização forçada"
                  )
              return "Nova informação detectada automaticamente no PokeMiners.\n\n" + compact[:3200]

          relevant_messages = []
          for msg in messages:
              text = full_text(msg)
              if text and is_pokeminers(msg, text) and relevant(text):
                  relevant_messages.append((msg, text))

          if not relevant_messages:
              print("Nenhuma atualização relevante do PokeMiners nas últimas 50 mensagens.")
              raise SystemExit(0)

          last_id = state_file.read_text(encoding="utf-8").strip() if state_file.exists() else ""

          # Primeira execução: cria o marco atual sem duplicar o conteúdo já enviado manualmente.
          if not last_id:
              current_id = str(relevant_messages[0][0].get("id") or "").strip()
              state_file.write_text(current_id + "\n", encoding="utf-8")
              print(f"OK: monitor inicializado no PokeMiners em {current_id}; próximos itens serão enviados automaticamente.")
              raise SystemExit(0)

          unseen = []
          for msg, text in relevant_messages:
              mid = str(msg.get("id") or "").strip()
              if mid == last_id:
                  break
              unseen.append((msg, text))

          if not unseen:
              print("Nenhuma nova atualização relevante do PokeMiners.")
              raise SystemExit(0)

          newest_sent_id = None
          for msg, text in list(reversed(unseen))[:5]:
              mid = str(msg.get("id") or "").strip()
              source_url = f"https://discord.com/channels/{guild_id}/{channel_id}/{mid}" if guild_id else None
              payload = {
                  "titulo": classify(text),
                  "mensagem": normalize(text) + "\n\n🔎 Fonte operacional: PokeMiners #miner-bot\n🕷️ Aguardando sua aprovação antes da publicação.",
                  "url": source_url,
                  "gerar_gpx": False,
                  "gerar_arte": False,
                  "aprovar": True,
              }
              _, data = request_json(endpoint, method="POST", payload=payload, timeout=120)
              if data.get("status") != "enviado" or data.get("etapa") != "aguardando_aprovacao":
                  raise RuntimeError("Resposta inesperada do Spidey: " + json.dumps(data, ensure_ascii=False))
              print(f"OK: PokeMiners {mid} enviado para aprovação.")
              newest_sent_id = mid

          if newest_sent_id:
              state_file.write_text(newest_sent_id + "\n", encoding="utf-8")
          PY

      - name: Salvar antirrepetição
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f last_pokeminers.txt ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_pokeminers.txt
          if ! git diff --cached --quiet; then
            git commit -m "Spidey: atualiza controle PokeMiners"
            git push origin HEAD:main
          fi
