name: Spidey Push v1 - validar branch

on:
  push:
    branches:
      - spidey-push-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spidey-app
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --ignore-scripts

      - name: Validar JavaScript e configuração
        run: |
          set -euo pipefail
          node --check app.js
          node --check push.js
          node --check sw.js
          node --check api/push/_store.js
          node --check api/push/public-key.js
          node --check api/push/subscribe.js
          node --check api/push/unsubscribe.js
          node --check api/push/dispatch.js
          node -e "import('web-push').then(() => console.log('web-push OK'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"
          grep -q 'push.js' index.html
          grep -q 'api/push/subscribe' push.js
          grep -q '?event=' ../notifications/queue.json
          echo 'Spidey Push v1: validação OK'
