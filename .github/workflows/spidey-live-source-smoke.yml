name: Spidey - smoke fontes ao vivo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-live-source-smoke.yml"

permissions:
  contents: read

jobs:
  fontes:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Python
        run: python -m pip install --quiet requests

      - name: Testar Pokémon GO oficial
        run: |
          python - <<'PY'
          from scripts.official_curated_monitor import buscar_noticias
          noticias = buscar_noticias()
          assert noticias, 'Nenhuma notícia oficial detectada'
          print('OFICIAL_OK', len(noticias), noticias[0][1])
          PY

      - name: Testar G47IX
        run: |
          python - <<'PY'
          import requests
          from scripts.g47ix_curated_monitor import FX_URL
          r=requests.get(FX_URL,headers={'User-Agent':'Mozilla/5.0'},timeout=60)
          r.raise_for_status()
          posts=[x for x in (r.json().get('results') or []) if isinstance(x,dict) and x.get('type')=='status']
          assert posts, 'G47IX sem publicações utilizáveis'
          print('G47IX_OK', len(posts), posts[0].get('id'))
          PY

      - name: Testar PokeMiners e SPS no Discord
        run: |
          python - <<'PY'
          import os, requests
          token=os.environ.get('DISCORD_BOT_TOKEN','').strip()
          assert token, 'DISCORD_BOT_TOKEN ausente'
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          fontes={
              'POKEMINERS':'1550962794814373898',
              'SPS':'1550962861998866564',
          }
          for nome,cid in fontes.items():
              r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':5},timeout=30)
              r.raise_for_status()
              msgs=r.json()
              assert isinstance(msgs,list), (nome, type(msgs))
              print(nome+'_OK', len(msgs), (msgs[0].get('id') if msgs else 'canal-vazio'))
          PY
