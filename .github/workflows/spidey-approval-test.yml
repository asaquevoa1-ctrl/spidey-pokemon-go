name: Spidey - teste aprovação

on:
  push:
    paths:
      - ".github/workflows/spidey-approval-test.yml"

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar deploy e enviar teste de aprovação
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://spidey-pokemon-go.onrender.com"
          sleep 60
          curl --silent --show-error --fail --max-time 180 \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "$BASE/enviar" <<'JSON'
          {
            "titulo": "🧪 G47IX • TESTE DE APROVAÇÃO",
            "mensagem": "Teste interno do novo fluxo editorial do Spidey. Nenhuma informação deste card deve ser publicada externamente.",
            "url": "https://x.com/g47ix",
            "gerar_arte": false,
            "aprovar": true
          }
          JSON
