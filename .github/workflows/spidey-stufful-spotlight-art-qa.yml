name: Spidey - QA responsivo Stufful Holofote
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/stufful-spotlight-hour-20261015-v1.png'
      - 'spidey-app/assets/events/premium/stufful-spotlight-hour-20261015-approved-v1.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'docs/qa/STUFFUL_SPOTLIGHT_ART_*.json'
      - 'tests/stufful-spotlight-art-approval.test.cjs'
      - 'scripts/qa_stufful_spotlight_art_browser.mjs'
      - '.github/workflows/spidey-stufful-spotlight-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/stufful-spotlight-art
          command -v google-chrome | tee test-results/stufful-spotlight-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_stufful_spotlight_art_browser.mjs 2>&1 | tee test-results/stufful-spotlight-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stufful-spotlight-responsive-preview
          path: test-results/stufful-spotlight-art
