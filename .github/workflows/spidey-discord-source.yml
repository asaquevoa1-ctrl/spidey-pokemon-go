name: Spidey - monitor eventos SPS encaminhados

on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-discord-source.yml"
      - "scripts/discord_source_monitor.py"
      - "last_discord_source.txt"

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preparar Python
        run: python -m pip install --quiet requests

      - name: Verificar eventos SPS encaminhados
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_SOURCE_CHANNEL_ID: "1550962861998866564"
          SPIDEY_ENDPOINT: "https://spidey-pokemon-go.onrender.com/enviar"
        run: python scripts/discord_source_monitor.py

      - name: Salvar antirrepetição
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- last_discord_source.txt; then
            echo "Sem novo evento para registrar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_discord_source.txt
          git commit -m "Spidey: registrar evento SPS processado"
          git push origin HEAD:main
