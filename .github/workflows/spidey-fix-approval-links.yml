name: Spidey - corrigir aprovacao Discord

on:
  push:
    paths:
      - ".github/workflows/spidey-fix-approval-links.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Adicionar links de aprovação como fallback confiável
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("bot.py")
          s = p.read_text(encoding="utf-8")

          marcador = '''def _botao_whatsapp(token):\n'''
          helper = '''def _links_aprovacao(token):\n    aprovar = f"{PUBLIC_BASE_URL}/aprovar?t={token}"\n    rejeitar = f"{PUBLIC_BASE_URL}/rejeitar?t={token}"\n    return f"\\n\\n✅ [APROVAR]({aprovar})   ❌ [REPROVAR]({rejeitar})"\n\n\n'''
          if "def _links_aprovacao(token):" not in s:
              if marcador not in s:
                  raise SystemExit("marcador para helper não encontrado")
              s = s.replace(marcador, helper + marcador, 1)

          antigo = 'conteudo["mensagem"] + "\\n\\nToque abaixo para decidir a publicação.",'
          novo = 'conteudo["mensagem"] + "\\n\\nEscolha uma opção:" + _links_aprovacao(token),'
          if antigo in s:
              s = s.replace(antigo, novo)

          antigo_erro = '''        if not resposta_botoes.ok:\n            raise RuntimeError(\n                f"Discord botões HTTP {resposta_botoes.status_code}: {resposta_botoes.text[:500]}"\n            )\n        return\n'''
          novo_erro = '''        if not resposta_botoes.ok:\n            print(\n                f"Discord não exibiu botões ({resposta_botoes.status_code}); links de aprovação permanecem disponíveis.",\n                flush=True,\n            )\n        return\n'''
          if antigo_erro in s:
              s = s.replace(antigo_erro, novo_erro, 1)

          p.write_text(s, encoding="utf-8")
          PY

          python -m py_compile bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if ! git diff --cached --quiet; then
            git commit -m "Spidey: garante aprovar e reprovar por links"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
