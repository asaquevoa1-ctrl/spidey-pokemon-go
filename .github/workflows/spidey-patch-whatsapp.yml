name: Spidey - integrar aprovacao e WhatsApp

on:
  push:
    paths:
      - ".github/workflows/spidey-patch-whatsapp.yml"
      - "patch_whatsapp.py"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python patch_whatsapp.py

      - name: Validar sintaxe
        run: python -m py_compile bot.py spidey_approval.py spidey_geo.py premium_art.py spidey_art_v4.py

      - name: Salvar alteracoes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
            exit 0
          fi
          git commit -m "Spidey: fecha aprovacao e prepara publicacao WhatsApp"
          git pull --rebase origin main
          git push origin HEAD:main
