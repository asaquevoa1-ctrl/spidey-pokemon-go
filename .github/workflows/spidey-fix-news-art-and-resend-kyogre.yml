name: Spidey - corrigir noticias com arte e reenviar Kyogre

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-fix-news-art-and-resend-kyogre.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Corrigir monitor PokeMiners para noticias com arte e sem URL crua
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/spidey-pokeminers.yml')
          s=p.read_text(encoding='utf-8')

          old='''                  return (\n                      "Nova notícia oficial do Pokémon GO detectada pelo PokeMiners.\\n\\n"\n                      f"📰 {title}\\n"\n                      f"🔗 Fonte oficial: {link}"\n                  )'''
          new='''                  return (\n                      "Nova notícia oficial do Pokémon GO detectada pelo PokeMiners.\\n\\n"\n                      f"📰 {title}\\n"\n                      "📌 Fonte oficial: Pokémon GO"\n                  )'''
          if old not in s:
              raise SystemExit('Trecho normalize(news) não encontrado')
          s=s.replace(old,new,1)

          old2='''              payload = {\n                  "titulo": classify(text),\n                  "mensagem": normalize(text) + "\\n\\n🔎 Fonte operacional: PokeMiners #miner-bot\\n🕷️ Aguardando sua aprovação antes da publicação.",\n                  "url": source_url,\n                  "gerar_gpx": False,\n                  "gerar_arte": False,\n                  "aprovar": True,\n              }'''
          new2='''              is_news = bool(re.search(r"Found a new news item on PokemonGoLive|@news updates|pokemongolive", text, re.I))\n              payload = {\n                  "titulo": classify(text),\n                  "mensagem": normalize(text) + "\\n\\n🔎 Fonte operacional: PokeMiners #miner-bot\\n🕷️ Aguardando sua aprovação antes da publicação.",\n                  "url": None if is_news else source_url,\n                  "gerar_gpx": False,\n                  "gerar_arte": is_news,\n                  "usar_premium": False if is_news else True,\n                  "permitir_fallback": True if is_news else False,\n                  "aprovar": True,\n              }'''
          if old2 not in s:
              raise SystemExit('Trecho payload não encontrado')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/spidey-pokeminers.yml
          git commit -m "Spidey: noticias PokeMiners com arte e sem link cru"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Reenviar Kyogre corrigido
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
          SPIDEY_ENDPOINT: "https://spidey-pokemon-go.onrender.com/enviar"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, requests, time
          endpoint=os.environ['SPIDEY_ENDPOINT']
          token=os.environ['DISCORD_BOT_TOKEN'].strip()
          dst=os.environ['APPROVAL_CHANNEL_ID']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          payload={
            'titulo':'🌊 GO PASS • OUTUBRO • KYOGRE',
            'mensagem':(
              'Pokémon GO anunciou o GO Pass: outubro de 2026.\n\n'
              '📅 Período: 6 de outubro, 10h → 3 de novembro, 10h — horário local.\n'
              '🌊 Recompensa em destaque: encontro com Kyogre, com chance de Brilhante.\n'
              '🎟️ GO Pass Deluxe: o Lucky Trinket retorna como recompensa final.\n'
              '🎁 Também há Doce Raro GG, Passe de Batalha Premium e Ovo da Sorte entre as recompensas.\n'
              '⏳ Recompensas desbloqueadas expiram em 5 de novembro, às 10h, horário local.\n'
              '🍀 O Lucky Trinket expira em 8 de novembro de 2026, às 23h59, horário local.\n\n'
              '📌 Fonte oficial: Pokémon GO\n'
              '🔎 Detectado por PokeMiners #miner-bot.'
            ),
            'url':None,
            'gerar_gpx':False,
            'gerar_arte':True,
            'usar_premium':False,
            'permitir_fallback':True,
            'aprovar':True,
          }
          r=requests.post(endpoint,json=payload,timeout=180)
          print('SPIDEY_HTTP',r.status_code)
          print('SPIDEY_RESPONSE',r.text[:1000])
          r.raise_for_status()
          data=r.json()
          assert data.get('status')=='enviado' and data.get('etapa')=='aguardando_aprovacao', data
          assert data.get('arte') is True, data
          assert data.get('modo_arte') in ('fallback_v4','premium','fornecida'), data
          time.sleep(1)
          rr=requests.get(f'https://discord.com/api/v10/channels/{dst}/messages',headers=h,params={'limit':20},timeout=30)
          rr.raise_for_status()
          for m in rr.json():
              embeds=m.get('embeds') or []
              title=((embeds[0].get('title') if embeds else '') or '')
              desc=((embeds[0].get('description') if embeds else '') or '')
              if 'KYOGRE' in title.upper() and 'GO PASS' in title.upper() and 'pokemongo.com/' not in desc.lower():
                  print('CORRECTED_ID',m['id'])
                  print('ATTACHMENTS',len(m.get('attachments') or []))
                  print('COMPONENT_ROWS',len(m.get('components') or []))
                  print('CORRECTED_LINK',f'https://discord.com/channels/1139279003451150467/{dst}/{m["id"]}')
                  if not m.get('attachments'):
                      raise SystemExit('Kyogre corrigido sem arte anexada')
                  raise SystemExit(0)
          raise SystemExit('Kyogre corrigido não localizado no Discord')
          PY
