name: Spidey - checar chave OpenAI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-check-openai-secret.yml"

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar se a chave existe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_SECRET_PRESENT=true"
          else
            echo "OPENAI_SECRET_PRESENT=false"
          fi
