name: Spidey - usar logo oficial binario

on:
  push:
    branches: [main]
    paths: [".github/workflows/spidey-fix-logo-binary.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Apontar gerador para o logo oficial JPEG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('spidey_art_v4.py')
          s=p.read_text(encoding='utf-8')
          old='''def _logo_oficial():\n    try:\n        raw = Path("assets/spidey-logo-oficial.b64").read_text(encoding="utf-8").strip()\n        return Image.open(io.BytesIO(base64.b64decode(raw))).convert("RGBA")\n    except Exception:\n        return None\n'''
          new='''def _logo_oficial():\n    try:\n        return Image.open(Path("assets/spidey-logo-oficial.jpg")).convert("RGBA")\n    except Exception:\n        return None\n'''
          if old not in s:
              raise SystemExit('Helper antigo do logo não encontrado')
          s=s.replace(old,new,1)
          s=s.replace('import base64\n','',1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile spidey_art_v4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spidey_art_v4.py
          git commit -m "Spidey: usar logo oficial JPEG no gerador"
          git pull --rebase origin main
          git push origin HEAD:main
