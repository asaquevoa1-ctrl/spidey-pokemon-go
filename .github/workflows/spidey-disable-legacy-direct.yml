name: Spidey - desligar disparos antigos diretos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-disable-legacy-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Remover agendas e pushes dos workflows antigos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              '.github/workflows/spidey-check.yml',
              '.github/workflows/spidey-g47ix.yml',
              '.github/workflows/spidey-pokeminers.yml',
              '.github/workflows/spidey-discord-source.yml',
              '.github/workflows/spidey-sps-weekly.yml',
          ]

          for name in paths:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              start = s.index('\non:\n') + 1
              end = s.index('\npermissions:', start)
              s = s[:start] + 'on:\n  workflow_dispatch:\n' + s[end:]
              p.write_text(s, encoding='utf-8')
              print('LEGADO_DESATIVADO', name)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/spidey-check.yml \
                  .github/workflows/spidey-g47ix.yml \
                  .github/workflows/spidey-pokeminers.yml \
                  .github/workflows/spidey-discord-source.yml \
                  .github/workflows/spidey-sps-weekly.yml
          git commit -m "Spidey: desativar rotas antigas de disparo direto"
          git pull --rebase origin main
          git push origin HEAD:main
