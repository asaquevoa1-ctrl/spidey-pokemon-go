name: Spidey - auditar fontes Discord

on:
  push:
    branches: [spidey-assets]
    paths:
      - ".github/workflows/spidey-source-audit.yml"
  workflow_dispatch:

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar canais e fontes espelhadas
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: "1139279003451150467"
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token=os.environ['DISCORD_BOT_TOKEN'].strip(); guild=os.environ['GUILD_ID']
          headers={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0','Accept':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())

          canais=get(f'https://discord.com/api/v10/guilds/{guild}/channels')
          print('CANAIS_TEXTO')
          for c in canais:
              if c.get('type') in (0,5,15,16):
                  print(f"- {c.get('name')} | {c.get('id')} | type={c.get('type')}")

          termos=('sps','humblegumbo','go-news','g47ix','shinypings','shiny pings','weekly','rendezvous','malaga','astronomical','observatory')
          print('MATCHES_RELEVANTES')
          total=0
          for c in canais:
              if c.get('type') not in (0,5):
                  continue
              cid=str(c.get('id')); nome=str(c.get('name') or '')
              try:
                  msgs=get(f'https://discord.com/api/v10/channels/{cid}/messages?limit=25')
              except Exception:
                  continue
              for m in msgs:
                  parts=[str(m.get('content') or '')]
                  for e in m.get('embeds') or []:
                      parts += [str(e.get('title') or ''), str(e.get('description') or '')]
                  autor=str((m.get('author') or {}).get('username') or '')
                  texto=' '.join(parts).replace('\n',' ').strip()
                  blob=(autor+' '+texto).lower()
                  if any(t in blob for t in termos):
                      print(f"- {nome} | {cid} | msg={m.get('id')} | autor={autor} | {texto[:220]}")
                      total += 1
          print('TOTAL_MATCHES',total)
          PY
