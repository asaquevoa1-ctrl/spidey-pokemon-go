name: Spidey - QA responsivo Pesquisa adidas
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/adidas-avatar-research-20260925-20270115-v1.png'
      - 'spidey-app/assets/events/premium/adidas-avatar-research-20260925-20270115-approved-v1.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'docs/qa/ADIDAS_AVATAR_RESEARCH_ART_*.json'
      - 'tests/adidas-avatar-research-art-approval.test.cjs'
      - 'scripts/qa_adidas_avatar_research_art_browser.mjs'
      - '.github/workflows/spidey-adidas-avatar-research-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/adidas-avatar-research-art
          command -v google-chrome | tee test-results/adidas-avatar-research-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_adidas_avatar_research_art_browser.mjs 2>&1 | tee test-results/adidas-avatar-research-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adidas-avatar-research-responsive-preview
          path: test-results/adidas-avatar-research-art
