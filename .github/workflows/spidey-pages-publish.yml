name: Publicar Spidey no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spidey-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos da versão atual
        uses: actions/checkout@v4
      - name: Preparar site estático
        run: |
          touch .nojekyll
          test -f spidey-app/index.html
          test -f spidey-app/data/stamps.json
          python3 - <<'PY'
          import json
          with open('spidey-app/data/stamps.json', encoding='utf-8') as f:
              rallies=json.load(f)['rallies']
          published=[r for r in rallies if r.get('status')=='published']
          stops=sum(len(r.get('stops',[])) for r in published)
          print(f'Selos publicados: {len(published)}; coordenadas: {stops}')
          assert len(published)>=10 and stops>=739, 'Catálogo incompleto: publicação interrompida'
          PY
      - name: Gravar identificação verificável da versão publicada
        env:
          SPIDEY_DEPLOY_SHA: ${{ github.sha }}
          SPIDEY_DEPLOY_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          with open('spidey-app/data/stamps.json', encoding='utf-8') as f:
              rallies = json.load(f)['rallies']
          published = [r for r in rallies if r.get('status') == 'published']
          version = {
              'schema': 'spidey-deployment-v1',
              'git_sha': os.environ['SPIDEY_DEPLOY_SHA'],
              'workflow_run_id': os.environ['SPIDEY_DEPLOY_RUN'],
              'generated_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'published_collections': len(published),
              'published_stops': sum(len(r.get('stops', [])) for r in published)
          }
          with open('spidey-app/deploy-version.json', 'w', encoding='utf-8') as f:
              json.dump(version, f, ensure_ascii=False, indent=2)
              f.write(chr(10))
          print('Versão a verificar por HTTP em /spidey-app/deploy-version.json:', version)
          PY
      - name: Enviar artefato ao GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar publicação HTTP e versão servida
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base = os.environ['PAGES_URL'].rstrip('/') + '/spidey-app/'
          expected = os.environ['EXPECTED_SHA']
          last_error = None
          for attempt in range(1, 13):
              try:
                  request = urllib.request.Request(
                      base + 'deploy-version.json?check=' + expected[:12],
                      headers={'Cache-Control': 'no-cache', 'User-Agent': 'Spidey-Pages-Verification'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      assert response.status == 200, f'HTTP {response.status}'
                      version = json.load(response)
                  assert version['git_sha'] == expected, f"SHA publicado {version['git_sha']} != {expected}"
                  assert version['published_collections'] >= 10
                  assert version['published_stops'] >= 739
                  print('GitHub Pages verificado por HTTP:', base, version)
                  break
              except (OSError, ValueError, KeyError, AssertionError) as error:
                  last_error = str(error)
                  print(f'Tentativa {attempt}/12: {last_error}')
                  if attempt < 12:
                      time.sleep(15)
          else:
              raise SystemExit('Deploy executado, mas versão pública NÃO verificada: ' + str(last_error))
          PY
