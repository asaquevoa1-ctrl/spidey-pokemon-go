name: Publicar Spidey no GitHub Pages (legado desativado)

# Arquivo histórico: NÃO publica o aplicativo.
# A única publicação oficial ocorre em .github/workflows/spidey-pages.yml.
# Não reativar deploy paralelo nem usar Vercel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legado_desativado:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Fluxo legado desativado; use spidey-pages.yml"
