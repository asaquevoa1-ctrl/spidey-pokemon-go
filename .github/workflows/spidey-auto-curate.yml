name: Spidey - auto-curadoria por mídia da fonte

on:
  push:
    branches:
      - main
    paths:
      - "queue/pending/**"
      - "queue/curated/**"
      - "scripts/auto_curate_pending.py"
      - "scripts/gold_art_upgrade.py"
      - "scripts/gold_source_fallback.py"
      - "scripts/revise_rejected_art.py"
      - "scripts/curated_dispatch.py"
      - "scripts/official_curated_monitor.py"
      - "scripts/g47ix_curated_monitor.py"
      - "scripts/pokeminers_curated_monitor.py"
      - "scripts/sps_curated_monitor.py"
      - "scripts/send_curated.py"
      - "scripts/spidey_art_guard.py"
      - "scripts/discord_publish_bridge.py"
      - ".github/workflows/spidey-auto-curate.yml"
      - ".github/workflows/spidey-curated.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-editorial-state-writer
  cancel-in-progress: false

jobs:
  curar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preparar Python
        run: python -m pip install --quiet requests pillow

      - name: Validar pipeline Spidey
        run: |
          python -m py_compile \
            scripts/auto_curate_pending.py \
            scripts/gold_art_upgrade.py \
            scripts/gold_source_fallback.py \
            scripts/revise_rejected_art.py \
            scripts/curated_dispatch.py \
            scripts/official_curated_monitor.py \
            scripts/g47ix_curated_monitor.py \
            scripts/pokeminers_curated_monitor.py \
            scripts/sps_curated_monitor.py \
            scripts/send_curated.py \
            scripts/spidey_art_guard.py \
            scripts/discord_publish_bridge.py \
            spidey_geo.py
          python scripts/test_curated_format.py

      - name: Preparar itens curados a partir da mídia da fonte
        env:
          SPIDEY_ASSET_BRANCH: ${{ github.ref_name }}
        run: python scripts/auto_curate_pending.py

      - name: Manter fail-closed até existir Premium real
        run: |
          echo "Nenhuma API paga é usada no fluxo de produção."
          echo "Fallback, mídia de fonte, vetor e placeholder não são promovidos a spidey-premium-v1."
          echo "O item permanece aguardando/bloqueado até receber arte Premium real."

      # gold_art_upgrade.py permanece como prova técnica/legado, mas NÃO roda no
      # fluxo de produção porque exige API paga.
      # gold_source_fallback.py permanece disponível apenas como preview técnico
      # e nunca marca uma peça como Premium nem a libera para o Discord.

      - name: Gravar resultado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/pending queue/curated assets/generated || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para gravar."
            exit 0
          fi
          git commit -m "Spidey: auto-curadoria factual [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
