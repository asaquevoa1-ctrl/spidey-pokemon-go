name: Spidey - debug logo hex

on:
  push:
    branches: [main]
    paths: [".github/workflows/spidey-debug-logo-hex.yml"]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install Pillow
      - name: Diagnosticar asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io,hashlib
          raw=Path('assets/spidey-logo-oficial.hex').read_text(encoding='utf-8').strip()
          print('HEX_LEN',len(raw))
          print('HEX_HEAD',raw[:32])
          print('HEX_TAIL',raw[-32:])
          try:
              b=bytes.fromhex(raw)
              print('BYTES_LEN',len(b))
              print('SHA256',hashlib.sha256(b).hexdigest())
              im=Image.open(io.BytesIO(b)); print('PIL_FORMAT',im.format); print('PIL_SIZE',im.size); im.verify(); print('PIL_VERIFY_OK')
          except Exception as e:
              print('ERRO',type(e).__name__,repr(str(e)))
              raise
          PY
