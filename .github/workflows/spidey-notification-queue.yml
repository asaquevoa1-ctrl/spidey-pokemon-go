name: Spidey Notifications - fila de avisos

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "spidey-app/data/events.json"
      - "scripts/build_notification_queue.py"
      - ".github/workflows/spidey-notification-queue.yml"

permissions:
  contents: write

concurrency:
  group: spidey-notification-queue-writer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validar e gerar fila
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_notification_queue.py
          python -m json.tool spidey-app/data/events.json >/dev/null
          python -m scripts.build_notification_queue
          python -m json.tool notifications/queue.json >/dev/null
          python - <<'PY'
          import json
          q=json.load(open('notifications/queue.json', encoding='utf-8'))
          assert q['schema_version'] == 'spidey-notification-queue-v1'
          ids=[job['id'] for job in q['jobs']]
          assert len(ids) == len(set(ids)), 'notificações duplicadas'
          assert all(job['status'] == 'pending' for job in q['jobs'])
          print('Fila de notificações OK:', len(q['jobs']), 'avisos')
          PY

      - name: Gravar fila somente quando mudar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifications/queue.json
          if git diff --cached --quiet; then
            echo "Fila sem mudanças."
            exit 0
          fi
          git commit -m "Spidey Notifications: atualiza fila [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
