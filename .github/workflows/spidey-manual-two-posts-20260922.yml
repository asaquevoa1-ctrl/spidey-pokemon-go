name: Spidey - dois disparos manuais 22-09

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-manual-two-posts-20260922.yml"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar MLB Seattle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mlb.json
          import json
          payload = {
            "titulo": "⚾ POKÉMON GO × MLB • SEATTLE MARINERS",
            "mensagem": "⏰ Horário local (Seattle): 18h40\n🇧🇷 Horário do Brasil (Brasília): 22h40\n\n📅 22 de setembro de 2026\n📍 T-Mobile Park • Seattle\n⚾ Seattle Mariners x Houston Astros\n\nO jogo temático do Seattle Mariners faz parte da colaboração Pokémon GO × MLB 2026. Nos jogos temáticos, o Pokémon GO anunciou Rotas Oficiais, PokéParadas e Ginásios temáticos nos estádios, raids de 1 estrela com Pikachu normal — com chance de Brilhante ou Fundo de Localização — além de Pesquisa temporária e tarefas de Pesquisa de Campo.\n\n🧢 O boné do Mariners é ITEM DE AVATAR obtido no jogo. Pikachu não usa boné nem camiseta.\n👕 Código global: MLBxPOKEMONGO2026 para camiseta MLB de avatar, disponível até 30/09/2026.\n\n🎨 Arte ilustrativa.\n🗺️ GPX anexo: T-Mobile Park.\n\nFonte principal: Pokémon GO oficial. Fonte complementar do horário: Seattle Mariners/MLB.",
            "url": "https://pokemongo.com/pt-BR/news/mlb-2026",
            "imagem_url": "https://raw.githubusercontent.com/asaquevoa1-ctrl/spidey-pokemon-go/main/assets/curated/spidey-mlb-seattle-2026-final.jpg",
            "coordenadas": [[47.59148, -122.332863]],
            "gerar_gpx": True,
            "gpx_nome": "spidey-mlb-seattle-2026.gpx",
            "gerar_arte": False,
            "aprovar": True
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          code=$(curl --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 240 --silent --show-error \
            -H 'Content-Type: application/json' --data-binary @/tmp/mlb.json \
            -o /tmp/mlb-resp.json -w '%{http_code}' \
            https://spidey-pokemon-go.onrender.com/enviar || true)
          echo "MLB HTTP $code"
          cat /tmp/mlb-resp.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/mlb-resp.json', encoding='utf-8'))
          assert d.get('status') == 'enviado', d
          assert d.get('etapa') == 'aguardando_aprovacao', d
          assert d.get('arte') is True, d
          assert d.get('modo_arte') == 'fornecida', d
          assert d.get('gpx') is True, d
          print('MLB_VALIDADO')
          PY

      - name: Enviar G47IX corrigido
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/g47ix.json
          import json
          payload = {
            "titulo": "📰 G47IX • RAIDS REGIONAIS DE 5 ESTRELAS",
            "mensagem": "Raids regionais de 5 estrelas com Ultra Beasts estão disponíveis por região.\n\n⚡ Xurkitree: Ásia-Pacífico\n🪽 Pheromosa: Europa, Oriente Médio, África e Índia\n💪 Buzzwole: Américas e Groenlândia\n\n✨ Se tiver sorte, você poderá encontrar a versão Brilhante.\n\n⏰ Horário: a publicação do G47IX não informou uma janela específica; o Spidey não vai inventar horário.\n\nFonte: G47IX.",
            "url": "https://x.com/g47ix/status/2102387437825913058",
            "coordenadas": [],
            "gerar_gpx": False,
            "gerar_arte": True,
            "usar_premium": True,
            "permitir_fallback": False,
            "aprovar": True
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          code=$(curl --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 --silent --show-error \
            -H 'Content-Type: application/json' --data-binary @/tmp/g47ix.json \
            -o /tmp/g47ix-resp.json -w '%{http_code}' \
            https://spidey-pokemon-go.onrender.com/enviar || true)
          echo "G47IX HTTP $code"
          cat /tmp/g47ix-resp.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/g47ix-resp.json', encoding='utf-8'))
          assert d.get('status') == 'enviado', d
          assert d.get('etapa') == 'aguardando_aprovacao', d
          assert d.get('arte') is True, d
          assert d.get('modo_arte') == 'premium', d
          print('G47IX_VALIDADO')
          PY
