name: Spidey - National Trust 27 coordenadas QA
on:
  pull_request:
    paths:
      - 'spidey-app/national-trust-v1.js'
      - 'spidey-app/national-trust-v1.css'
      - 'spidey-app/data/national-trust-2026.json'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'scripts/qa_national_trust_browser.mjs'
      - '.github/workflows/spidey-national-trust-qa.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - name: Verificar 27 pontos e cópia em mobile e desktop
        run: |
          mkdir -p test-results/national-trust-27
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_national_trust_browser.mjs 2>&1 | tee test-results/national-trust-27/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-trust-mobile-preview
          path: test-results/national-trust-27
