name: Spidey Weekly - resumo semanal

on:
  schedule:
    # Atualiza também quando o catálogo muda sem um novo push de usuário.
    - cron: '29 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_spidey_weekly.py"
      - "scripts/test_spidey_weekly.py"
      - "spidey-app/data/events.json"
      - "spidey-app/data/stamps.json"
      - "spidey-app/premium-approved-master.js"
      - ".github/workflows/spidey-weekly.yml"

permissions:
  contents: write

concurrency:
  group: spidey-weekly-writer
  cancel-in-progress: false

# Gera o pacote editorial do visual aprovado "Spidey Weekly".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validar gerador
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_spidey_weekly.py
          python -m scripts.test_spidey_weekly
          python -m json.tool spidey-app/data/events.json >/dev/null
          python -m json.tool spidey-app/data/stamps.json >/dev/null

      - name: Gerar Spidey Weekly
        run: python -m scripts.build_spidey_weekly

      - name: Validar saída e artes individuais
        run: |
          set -euo pipefail
          python -m json.tool weekly/current.json >/dev/null
          python -m json.tool spidey-app/data/weekly.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_spidey_weekly import validate_weekly
          data=json.load(open('weekly/current.json', encoding='utf-8'))
          app_data=json.load(open('spidey-app/data/weekly.json', encoding='utf-8'))
          assert data == app_data, 'weekly.json do app divergiu do pacote canônico'
          validate_weekly(data)
          archive=Path('weekly/archive') / f"{data['week_start']}.json"
          assert archive.exists(), archive

          print('Spidey Weekly OK:', data['title'])
          print('Eventos da agenda:', data['meta']['events_in_weekly'])
          print('Premium:', data['meta']['events_with_premium_weekly_art'])
          print('Imagens oficiais:', data['meta']['events_with_official_weekly_art'])
          print('Sem arte:', data['meta']['events_without_weekly_art'])
          PY

      - name: Gravar pacote semanal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/current.json weekly/archive spidey-app/data/weekly.json
          if git diff --cached --quiet; then
            echo "Weekly já estava atualizado."
            exit 0
          fi
          git commit -m "Spidey Weekly: atualiza resumo semanal [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
