name: Spidey - conectar canal oficial WhatsApp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-wire-whatsapp-channel.yml"
      - "scripts/patch_whatsapp_channel.py"

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar canal oficial
        run: python scripts/patch_whatsapp_channel.py

      - name: Validar bot
        run: python -m py_compile bot.py

      - name: Gravar alteracao
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "Canal ja conectado."
            exit 0
          fi
          git commit -m "Spidey: usa canal oficial do WhatsApp [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
