name: Spidey - conectar canal oficial WhatsApp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-wire-whatsapp-channel.yml"

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Conectar canal oficial
        shell: python
        run: |
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          channel_url = "https://whatsapp.com/channel/0029VbDnlXB2f3EI6wqIcW2F"

          old_buttons = '''                {
                    "type": 2,
                    "style": 5,
                    "label": "📲 Preparar WhatsApp",
                    "url": preparar,
                }
'''
          new_buttons = old_buttons + f'''                {{
                    "type": 2,
                    "style": 5,
                    "label": "📢 Abrir canal Spidey",
                    "url": "{channel_url}",
                }}
'''
          if "📢 Abrir canal Spidey" not in text:
              if old_buttons not in text:
                  raise SystemExit("Ancora dos botoes nao encontrada")
              text = text.replace(old_buttons, new_buttons, 1)

          old_page = '<a class="btn wa" href="{wa_url}">📲 Abrir WhatsApp</a>'
          new_page = old_page + f'\n<a class="btn wa" href="{channel_url}">📢 Abrir canal Spidey Pokémon GO</a>'
          if "📢 Abrir canal Spidey Pokémon GO</a>" not in text:
              if old_page not in text:
                  raise SystemExit("Ancora da pagina WhatsApp nao encontrada")
              text = text.replace(old_page, new_page, 1)

          old_help = 'No WhatsApp, selecione o seu Canal, publique a arte e o texto; quando houver coordenadas, envie cada coordenada separadamente.'
          new_help = 'No WhatsApp, use o botão Abrir canal Spidey Pokémon GO, publique a arte e cole o texto; quando houver coordenadas, envie cada coordenada separadamente.'
          if old_help in text:
              text = text.replace(old_help, new_help, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validar Python
        run: python -m py_compile bot.py

      - name: Gravar alteracao
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "Canal ja conectado."
            exit 0
          fi
          git commit -m "Spidey: usa canal oficial do WhatsApp [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
