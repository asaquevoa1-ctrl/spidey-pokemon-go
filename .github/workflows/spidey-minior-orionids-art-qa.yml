name: Spidey - QA responsivo Minior Orionidas
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/minior-orionids-20261019-24-v1.png'
      - 'spidey-app/assets/events/premium/minior-orionids-20261019-24-approved-v1.png'
      - 'spidey-app/assets/events/review/minior-orionids-20261019-24-v2.png'
      - 'spidey-app/assets/events/premium/minior-orionids-20261019-24-approved-v2.png'
      - 'spidey-app/assets/events/premium/minior-orionids-20261019-24-cosmic-s-approved-v4.png'
      - 'docs/qa/MINIOR_ORIONIDS_ART_APPROVAL_20261012.json'
      - 'docs/qa/SPIDEY_PREMIUM_REFERENCE_FIVE_ARTS_20261014.json'
      - 'tests/minior-orionids-art-approval.test.cjs'
      - 'tests/spidey-reference-five-posters.test.cjs'
      - 'spidey-app/sw.js'
      - 'config/spidey-protected-approved-baseline.json'
      - 'spidey-app/preview-art.js'
      - 'spidey-app/premium-approved-master.js'
      - 'scripts/qa_minior_orionids_art_browser.mjs'
      - '.github/workflows/spidey-minior-orionids-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/minior-orionids-art
          command -v google-chrome | tee test-results/minior-orionids-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_minior_orionids_art_browser.mjs 2>&1 | tee test-results/minior-orionids-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minior-orionids-responsive-preview
          path: test-results/minior-orionids-art
