name: Spidey - corrigir e enviar Holofote Rattata 2026-09-24

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-send-holofote-rattata-20260924.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir_enviar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      APPROVAL_CHANNEL_ID: "1550963072464715997"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Respeitar lista explícita de coordenadas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')
          old='''    coordenadas = _coordenadas_explicitas(dados.get("coordenadas"))\n    if not coordenadas:\n        coordenadas = extrair_coordenadas(mensagem_original)\n'''
          new='''    if "coordenadas" in dados:\n        coordenadas = _coordenadas_explicitas(dados.get("coordenadas"))\n    else:\n        coordenadas = extrair_coordenadas(mensagem_original)\n'''
          if old not in s:
              raise SystemExit('Trecho de coordenadas esperado não encontrado')
          s=s.replace(old,new,1)
          marker='return "🕷️ Spidey Pokémon GO está online!"'
          if marker in s:
              s=s.replace(marker,'return "🕷️ Spidey Pokémon GO está online! | explicit-coords-v2"',1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Spidey: respeitar coordenadas explicitas sem duplicar lista"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar deploy da correção
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            body=$(curl --silent --show-error --max-time 20 https://spidey-pokemon-go.onrender.com/ || true)
            echo "Tentativa $i: $body"
            if printf '%s' "$body" | grep -q 'explicit-coords-v2'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"

      - name: Remover tentativa anterior do Holofote
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import os, requests
          token=os.environ.get('DISCORD_BOT_TOKEN','').strip()
          channel=os.environ['APPROVAL_CHANNEL_ID']
          if not token:
              raise SystemExit('DISCORD_BOT_TOKEN ausente')
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          r=requests.get(f'https://discord.com/api/v10/channels/{channel}/messages',headers=h,params={'limit':50},timeout=30)
          r.raise_for_status()
          apagadas=0
          for m in r.json():
              title=' '.join(str(e.get('title') or '') for e in (m.get('embeds') or []))
              desc=' '.join(str(e.get('description') or '') for e in (m.get('embeds') or []))
              probe=(title+' '+desc).upper()
              if 'HORA DO HOLOFOTE' in probe and 'RATTATA' in probe:
                  d=requests.delete(f'https://discord.com/api/v10/channels/{channel}/messages/{m["id"]}',headers=h,timeout=30)
                  print('DELETE',m['id'],d.status_code)
                  if d.status_code==204:
                      apagadas+=1
          print('APAGADAS',apagadas)
          PY

      - name: Enviar versão limpa para aprovação
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          {
            "titulo": "✨ HORA DO HOLOFOTE • RATTATA",
            "mensagem": "📅 24 de setembro de 2026\n⏰ 18h às 19h — horário local\n✨ Brilhante disponível\n🎁 Bônus: 2× XP por evolução\n📏 Chance aumentada de encontrar Rattata XXS\n\n🇧🇷 HORÁRIOS DE BRASÍLIA\n\n📅 24 DE SETEMBRO\n\n01h00 — 🇰🇮 Kiritimati, Kiribati\n📍 1.987149,-157.477137\n\n03h00 — 🇳🇿 Auckland, Nova Zelândia\n📍 -36.852095,174.763180\n\n05h00 — 🇦🇺 Sydney, Austrália\n📍 -33.866173,151.205945\n\n06h00 — 🇯🇵 Shinjuku, Japão\n📍 35.688950,139.690540\n\n07h00 — 🇸🇬 Singapura\n📍 1.292400,103.847600\n\n09h30 — 🇮🇳 Chennai, Índia\n📍 13.040300,80.266600\n\n11h00 — 🇦🇪 Dubai, Emirados Árabes\n📍 25.076750,55.132940\n\n12h00 — 🇹🇷 Istambul, Turquia\n📍 41.008200,28.978400\n\n13h00 — 🇪🇸 Zaragoza, Espanha\n📍 41.661609,-0.894640\n\n14h00 — 🇬🇧 Londres, Reino Unido\n📍 51.501000,-0.124600\n\n16h00 — 🇨🇻 Praia, Cabo Verde\n📍 14.910725,-23.527823\n\n17h00 — 🇧🇷 Fernando de Noronha, Brasil\n📍 -3.840100,-32.411810\n\n18h00 — 🇧🇷 Ibirapuera, São Paulo\n📍 -23.584171,-46.660725\n\n19h00 — 🇺🇸 Central Park, Nova York\n📍 40.780300,-73.963000\n\n20h00 — 🇺🇸 Chicago, EUA\n📍 41.898659,-87.623077\n\n21h00 — 🇺🇸 Denver, EUA\n📍 39.739200,-104.990300\n\n22h00 — 🇺🇸 Pier 39, São Francisco\n📍 37.809500,-122.410100\n\n23h00 — 🇺🇸 Anchorage, Alasca\n📍 61.217019,-149.891609\n\n📅 DIA SEGUINTE • 25 DE SETEMBRO\n\n01h00 — 🇺🇸 Honolulu, Havaí\n📍 21.265800,-157.821300\n\n02h00 — 🇦🇸 Pago Pago, Samoa Americana\n📍 -14.277739,-170.688512\n\n📌 Fonte oficial: Pokémon GO",
            "imagem_url": "https://raw.githubusercontent.com/asaquevoa1-ctrl/spidey-pokemon-go/main/assets/approved/2026-09-24/spidey-holofote-rattata.jpg",
            "gerar_arte": false,
            "usar_premium": false,
            "permitir_fallback": false,
            "arte_padrao_spidey": true,
            "aprovar": true,
            "gerar_gpx": false,
            "coordenadas": []
          }
          JSON

          code=$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            https://spidey-pokemon-go.onrender.com/enviar)
          cat /tmp/response.json
          echo
          echo "HTTP=$code"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/response.json', encoding='utf-8'))
          assert data.get('status') == 'enviado', data
          assert data.get('etapa') == 'aguardando_aprovacao', data
          assert data.get('arte') is True, data
          assert data.get('modo_arte') == 'fornecida', data
          assert data.get('coordenadas') == 0, data
          print('HOLOFOTE_RATTATA_LIMPO_VALIDADO')
          PY
