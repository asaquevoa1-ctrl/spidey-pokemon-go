name: Spidey - QA responsivo Shopping Asia-Pacifico
on:
  pull_request:
    paths:
      - 'spidey-app/assets/events/review/apac-mall-exploration-20261001-20270328-v1.png'
      - 'spidey-app/assets/events/premium/apac-mall-exploration-20261001-20270328-approved-v1.png'
      - 'spidey-app/premium-approved-master.js'
      - 'spidey-app/index.html'
      - 'spidey-app/sw.js'
      - 'docs/qa/APAC_MALL_EXPLORATION_ART_*.json'
      - 'tests/apac-mall-exploration-art-approval.test.cjs'
      - 'scripts/qa_apac_mall_exploration_art_browser.mjs'
      - '.github/workflows/spidey-apac-mall-exploration-art-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright-core@1.56.1
      - run: |
          mkdir -p test-results/apac-mall-exploration-art
          command -v google-chrome | tee test-results/apac-mall-exploration-art/chrome-path.txt
          CHROME_PATH="$(command -v google-chrome)" node scripts/qa_apac_mall_exploration_art_browser.mjs 2>&1 | tee test-results/apac-mall-exploration-art/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apac-mall-exploration-responsive-preview
          path: test-results/apac-mall-exploration-art
