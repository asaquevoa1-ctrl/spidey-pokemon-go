name: Spidey - validar pipeline curado

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "*.py"
      - ".github/workflows/spidey-*-curated.yml"
      - ".github/workflows/spidey-validate-curated-pipeline.yml"
      - ".github/workflows/spidey-apply-bot-hardening.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "*.py"
      - ".github/workflows/spidey-*-curated.yml"
      - ".github/workflows/spidey-validate-curated-pipeline.yml"
      - ".github/workflows/spidey-apply-bot-hardening.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Python
        run: python -m pip install --quiet -r requirements.txt

      - name: Validar sintaxe Python
        run: python -m compileall -q bot.py spidey_approval.py scripts

      - name: Simular hardening do bot sem alterar o repositório
        run: python scripts/patch_bot_hardening.py --check-only

      - name: Rodar testes do pipeline
        run: python -m unittest -v test_pipeline_stability.py test_spidey_approval.py test_spidey_geo.py test_world_event_times.py

      - name: Validar entrada dos quatro monitores
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          nomes = (
              'scripts.official_curated_monitor',
              'scripts.g47ix_curated_monitor',
              'scripts.pokeminers_curated_monitor',
              'scripts.sps_curated_monitor',
          )
          for nome in nomes:
              modulo = importlib.import_module(nome)
              assert callable(getattr(modulo, 'main', None)), nome
              print('OK', nome)
          PY
