name: Spidey - validar handoff WhatsApp

on:
  push:
    branches: [spidey-assets]
    paths:
      - ".github/workflows/spidey-test-whatsapp-handoff.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Validar página Preparar WhatsApp
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
        run: |
          python - <<'PY'
          import os, requests
          token=os.environ['DISCORD_BOT_TOKEN'].strip(); cid=os.environ['APPROVAL_CHANNEL_ID']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':100},timeout=30); r.raise_for_status()
          msgs=sorted(r.json(),key=lambda m:int(m['id']))
          marker='🧪 TESTE TÉCNICO • E2E SPIDEY'
          approved=None
          for m in msgs:
              e=(m.get('embeds') or [{}])[0]
              if marker in str(e.get('title') or '') and str(e.get('title') or '').startswith('✅ APROVADO'):
                  approved=m
          assert approved, 'Mensagem aprovada do teste não localizada'
          aid=int(approved['id'])
          wa=None
          for m in msgs:
              if int(m['id']) < aid: continue
              for row in m.get('components') or []:
                  for c in row.get('components') or []:
                      u=str(c.get('url') or '')
                      if '/whatsapp?t=' in u:
                          wa=u; break
                  if wa: break
              if wa: break
          assert wa, 'Botão Preparar WhatsApp não localizado'
          page=requests.get(wa,timeout=60)
          print('WHATSAPP_PAGE',page.status_code)
          page.raise_for_status()
          html=page.text
          for expected in ('Pronto para o WhatsApp','Abrir WhatsApp','É só copiar','-89.1234567,-179.7654321'):
              assert expected in html, f'Ausente na página: {expected}'
          assert 'https://wa.me/?text=' in html, 'Link wa.me não foi gerado'
          print('HANDOFF_WHATSAPP_OK')
          PY
