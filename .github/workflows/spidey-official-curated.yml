name: Spidey - oficial curado

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-official-curated
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SPIDEY_BASE: "https://spidey-pokemon-go.onrender.com"
      OFFICIAL_STATE_FILE: "last_news.txt"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verificar notícia oficial e preparar arte curada
        run: python scripts/official_curated_monitor.py

      - name: Salvar antirrepetição
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- last_news.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_news.txt
          git commit -m "Spidey: atualiza ultima noticia oficial curada"
          git pull --rebase origin main
          git push origin HEAD:main
