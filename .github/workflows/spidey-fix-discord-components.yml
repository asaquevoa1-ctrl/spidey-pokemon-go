name: Spidey - corrigir fallback Discord e enviar ESA

on:
  push:
    paths:
      - ".github/workflows/spidey-fix-discord-components.yml"

permissions:
  contents: write

jobs:
  corrigir-e-enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Corrigir fallback de componentes do Discord
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          antigo = '''    if not resposta.ok and components and (imagem_bytes or gpx_bytes):\n        print(\n            f"Discord recusou anexos + componentes ({resposta.status_code}); usando fallback em duas mensagens.",\n            flush=True,\n        )\n        payload_conteudo = dict(payload)\n        payload_conteudo.pop("components", None)\n        payload_conteudo.pop("attachments", None)\n        resposta_conteudo = requests.post(\n            webhook_url,\n            data={"payload_json": json.dumps(payload_conteudo, ensure_ascii=False)},\n            files=files,\n            timeout=60,\n        )\n'''
          novo = '''    if not resposta.ok and components:\n        print(\n            f"Discord recusou componentes ({resposta.status_code}); reenviando conteúdo sem botões.",\n            flush=True,\n        )\n        payload_conteudo = dict(payload)\n        payload_conteudo.pop("components", None)\n        if imagem_bytes or gpx_bytes:\n            payload_conteudo.pop("attachments", None)\n            resposta_conteudo = requests.post(\n                webhook_url,\n                data={"payload_json": json.dumps(payload_conteudo, ensure_ascii=False)},\n                files=files,\n                timeout=60,\n            )\n        else:\n            resposta_conteudo = requests.post(\n                webhook_url,\n                json=payload_conteudo,\n                timeout=15,\n            )\n'''
          if antigo not in s:
              raise SystemExit('Trecho esperado de bot.py não encontrado; abortando para não alterar código errado.')
          p.write_text(s.replace(antigo, novo, 1), encoding='utf-8')
          PY
          python -m py_compile bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Spidey: fallback Discord também sem anexos"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Aguardar Render atualizar
        shell: bash
        run: |
          set -euo pipefail
          sleep 75
          for i in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/health.txt -w "%{http_code}" --max-time 20 "https://spidey-pokemon-go.onrender.com/" || true)
            echo "Health $i: HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.txt
              break
            fi
            sleep 15
          done

      - name: Enviar evento ESA para aprovacao
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 120 \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "https://spidey-pokemon-go.onrender.com/enviar" <<'JSON'
          {
            "titulo": "🚀 EVENTO • Pokémon GO x Agência Espacial Europeia",
            "mensagem": "Pokémon GO e a Agência Espacial Europeia (ESA) anunciaram uma colaboração especial. De 4 de outubro de 2026 a 30 de abril de 2027, museus participantes na Europa terão Reides de 1 estrela com Pikachu Astronauta, Pesquisa Temporária e encontros especiais. Pikachu Astronauta poderá vir com Fundo de Localização e também poderá aparecer Brilhante.\n\nDe 4 a 10 de outubro, os locais participantes também terão Pesquisa de Campo e mais aparições de Pikachu, Clefairy, Magnemite, Starmie, Lunatone, Solrock, Elgyem e Blipbug.\n\nMuseus participantes: Science Museum (Londres), Cité de l’espace (Toulouse), Deutsches Museum (Nuremberg), Museu de les Ciències (Valência), Space Expo (Noordwijk) e Euro Space Center (Transinne).\n\nLocais da ESA em Paris, Frascati, Darmstadt, Madrid, Noordwijk, Redu e Harwell também terão o gameplay entre 4 e 10 de outubro, mas sem Fundos de Localização.\n\nFonte oficial: Pokémon GO / ESA",
            "url": "https://pokemongo.com/en/news/european-space-agency-event",
            "gerar_gpx": false,
            "gerar_arte": false,
            "aprovar": true
          }
          JSON
