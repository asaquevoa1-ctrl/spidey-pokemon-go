name: Spidey - hospedagem gratuita

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['spidey-app/**', 'config/spidey-web-analytics.json', 'config/spidey-push.json', 'config/spidey-art-date-scopes.json', 'scripts/check_editorial_integrity.cjs', 'scripts/build_spidey_pages.py', 'scripts/test_spidey_pages.py', 'tests/web-analytics.test.cjs', 'tests/explorer-gadget-news-*.test.cjs', 'tests/fly-*.test.cjs', 'tests/weekly-*.test.cjs', 'tests/national-trust-*.test.cjs', 'tests/spidey-pages-latest-release-20261101.test.cjs', 'scripts/qa_trust_27_public_pages.mjs', 'scripts/qa_wild_cdmx_public_pages.mjs', 'spidey-app/news-premium-20261102.js', 'spidey-app/news-premium-20261102.css', 'tests/news-premium-20261102.test.cjs', 'tests/trainer-profile-backgrounds-20261102.test.cjs', 'tests/weekly-day-fix-20261102.test.cjs', 'tests/fly-premium-20261102.test.cjs', 'tests/fly-remove-old-panels-20261102.test.cjs', 'tests/stamps-premium-20261102.test.cjs', 'tests/stamps-community-routes-20261102.test.cjs', 'tests/pvp-premium-20261102.test.cjs', '.github/workflows/spidey-pages.yml']
  pull_request:
    paths: ['spidey-app/**', 'config/spidey-web-analytics.json', 'config/spidey-push.json', 'config/spidey-art-date-scopes.json', 'scripts/check_editorial_integrity.cjs', 'scripts/build_spidey_pages.py', 'scripts/test_spidey_pages.py', 'tests/web-analytics.test.cjs', 'tests/explorer-gadget-news-*.test.cjs', 'tests/fly-*.test.cjs', 'tests/weekly-*.test.cjs', 'tests/national-trust-*.test.cjs', 'tests/spidey-pages-latest-release-20261101.test.cjs', 'scripts/qa_trust_27_public_pages.mjs', 'scripts/qa_wild_cdmx_public_pages.mjs', 'spidey-app/news-premium-20261102.js', 'spidey-app/news-premium-20261102.css', 'tests/news-premium-20261102.test.cjs', 'tests/trainer-profile-backgrounds-20261102.test.cjs', 'tests/weekly-day-fix-20261102.test.cjs', 'tests/fly-premium-20261102.test.cjs', 'tests/fly-remove-old-panels-20261102.test.cjs', 'tests/stamps-premium-20261102.test.cjs', 'tests/stamps-community-routes-20261102.test.cjs', 'tests/pvp-premium-20261102.test.cjs', '.github/workflows/spidey-pages.yml']
  workflow_run:
    workflows: ['Spidey Weekly - resumo semanal', 'Spidey - Caçador feed parceiro']
    types: [completed]
    branches: [main]
  # Captures catalog commits made by GITHUB_TOKEN, which don't trigger push workflows.
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: read

# O site público deve receber a versão MAIS RECENTE de main.
# Serializar publicações evita cancelar deploys em andamento.
concurrency:
  group: spidey-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'public' }}
  # Não interromper um deploy em andamento: cancelamentos sucessivos podem
  # impedir a publicação durante atualizações frequentes do catálogo.
  # A fila termina e a execução agendada posterior publica o HEAD mais recente.
  cancel-in-progress: false

jobs:
  build:
    outputs:
      source_sha: ${{ steps.capture_sha.outputs.sha }}
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.name != 'Spidey - Caçador feed parceiro' || vars.HUNTER_FEED_LICENSE_APPROVED == 'true'))
    runs-on: ubuntu-latest
    # Testes Node/Python, empacotamento e upload podem exceder 5 minutos.
    # Evitar que o build seja cancelado antes de gerar o artefato Pages.
    timeout-minutes: 15
    steps:
      # Pushes em fila podem apontar para commits antigos; publicar sempre o HEAD
      # de main nos eventos de deploy. PR continua testando sua propria revisao.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - name: Fixar a revisão do pacote público
        id: capture_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir empacotamento e integridade
        run: python -m unittest scripts.test_spidey_pages
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir sintaxe do verificador Wild Area
        run: node --check scripts/qa_wild_cdmx_public_pages.mjs
      - name: Conferir sintaxe das rotas comunitárias Aço e Dragão
        run: node --check spidey-app/wild-mexico-type-stops-20261106.js
      - name: Conferir limites da medição de acessos
        run: node --test tests/web-analytics.test.cjs
      - name: Conferir Novidades Premium e fontes reais
        run: node --test tests/news-premium-20261102.test.cjs
      - name: Validar noticia de fundos no perfil sem inventar confirmacao oficial
        run: node --test tests/trainer-profile-backgrounds-20261102.test.cjs
      - name: Conferir Explorer Gadget, status gradual e relatos separados
        run: node --test tests/explorer-gadget-news-20261102.test.cjs
      - name: Validar FLY Premium sem alterar coordenadas ou horarios
        run: node --test tests/fly-premium-20261102.test.cjs
      - name: Conferir limpeza dos paineis do FLY e preservar origem
        run: node --test tests/fly-remove-old-panels-20261102.test.cjs tests/fly-historical-list-dst-20261022.test.cjs
      - name: Conferir identidade Premium da galeria Selos e PokéLids
        run: node --test tests/stamps-premium-20261102.test.cjs
      - name: Conferir as 16 coordenadas da comunidade, separadas dos selos oficiais
        run: node --test tests/stamps-community-routes-20261102.test.cjs
      - name: Validar as rotas com ingresso de Sendai e México no pacote
        run: |
          node --check spidey-app/ticket-rally-community-20261107.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('spidey-app/data/ticket-rally-community-20261107.json').read_text(encoding='utf-8'))
          routes = data['routes']
          assert {route['id'] for route in routes} == {'sendai', 'mexico'}
          assert data['ticket_required'] is True and data['exact_pokestops_verified'] is False
          assert all(len(route['coords']) == 7 for route in routes)
          for route in routes:
              for point in route['coords']:
                  lat, lon = map(float, point.split(','))
                  assert -90 <= lat <= 90 and -180 <= lon <= 180
          print('Rotas comunitárias preservadas: Sendai 7 + México 7')
          PY
      - name: Conferir visual e controles do painel PvP Premium
        run: node --test tests/pvp-premium-20261102.test.cjs
      - name: Conferir Semana nos sete dias e horarios em Brasilia
        run: node --test tests/weekly-day-fix-20261102.test.cjs tests/weekly-cards.test.cjs
      - name: Testar lista e cópia das 27 coordenadas antes de publicar
        run: node --test tests/national-trust-27-places.test.cjs tests/national-trust-event-coordinates-20261101.test.cjs tests/spidey-pages-latest-release-20261101.test.cjs
      - name: Bloquear arte datada errada e texto interno antes de publicar
        run: node scripts/check_editorial_integrity.cjs
      - name: Preparar somente os arquivos públicos
        run: python scripts/build_spidey_pages.py --output pages-public
      - name: Bloquear catálogo incompleto antes da publicação
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = [Path('pages-public/spidey-app/data/stamps.json'), Path('pages-public/data/stamps.json')]
          path = next((p for p in candidates if p.is_file()), None)
          assert path is not None, 'Catálogo de selos ausente no artefato público'
          rallies = json.loads(path.read_text(encoding='utf-8'))['rallies']
          active = [r for r in rallies if r.get('status') == 'published']
          stops = sum(len(r.get('stops', [])) for r in active)
          print(f'Catálogo do artefato: {len(active)} coleções, {stops} pontos')
          assert len(active) >= 11 and stops >= 744, 'Artefato público incompleto: mínimo aprovado 11 coleções/744 pontos'
          PY
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: pages-public
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Conferir exatamente os arquivos usados no build, não um main posterior.
          ref: ${{ needs.build.outputs.source_sha }}
      # Não permitir que um build antigo sobrescreva um deploy mais novo.
      # O agendamento seguinte publica o HEAD atualizado se houver novo commit.
      - name: Impedir publicação de pacote ultrapassado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          BUILT_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GH_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/ref/heads/main',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
              })
          with urllib.request.urlopen(req, timeout=20) as response:
              latest = json.load(response)['object']['sha']
          built = os.environ['BUILT_SHA']
          print(f'Pacote construído: {built}; HEAD atual: {latest}')
          if latest != built:
              print('::error::Deploy bloqueado: pacote desatualizado. A próxima execução publicará a main mais recente.')
              raise SystemExit(1)
          PY
      - name: Verificar se Pages aceita publicação por Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/pages'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  pages = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f'::warning::Não foi possível ler a configuração do Pages (HTTP {exc.code}); verificar Settings > Pages.')
          else:
              mode = pages.get('build_type', 'desconhecido')
              print('GitHub Pages: build_type=' + mode + ', status=' + str(pages.get('status')))
              if mode != 'workflow':
                  print('::error::Pages está configurado para publicar por branch, não por GitHub Actions. Em Settings > Pages > Build and deployment > Source, selecionar GitHub Actions.')
                  raise SystemExit(1)
          PY
      - uses: actions/configure-pages@v5
      - name: Publicar Spidey
        id: deployment
        uses: actions/deploy-pages@v4
      # Reconstroi deterministicamente os mesmos arquivos para validar o
      # sw.js e o index.html publicados, que diferem dos arquivos-fonte.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar pacote identico para auditoria publica
        run: python scripts/build_spidey_pages.py --output pages-public
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Este passo só termina com sucesso quando o site PÚBLICO
      # entrega o botão Copiar todas e as 27 coordenadas.
      - name: Confirmar catálogo e arquivos reais do Pages por HTTP
        env:
          SPIDEY_EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request
          base = 'https://asaquevoa1-ctrl.github.io/spidey-pokemon-go/spidey-app/'
          files = ('index.html', 'app.js', 'news-premium-20261102.js', 'wild-mexico-type-stops-20261106.js', 'ticket-rally-community-20261107.js', 'data/ticket-rally-community-20261107.json', 'sw.js', 'data/stamps.json')
          expected = {name: hashlib.sha256((pathlib.Path('pages-public/spidey-app') / name).read_bytes()).hexdigest() for name in files}
          error = None
          for attempt in range(12):
              try:
                  for name in files:
                      url = base + name + '?deploy_check=' + os.environ['SPIDEY_EXPECTED_SHA'][:12]
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Spidey-Pages-QA'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          assert response.status == 200, f'{name}: HTTP {response.status}'
                          data = response.read()
                      actual = hashlib.sha256(data).hexdigest()
                      assert actual == expected[name], f'{name}: hash HTTP {actual} != pacote {expected[name]}'
                      if name == 'data/ticket-rally-community-20261107.json':
                          community = json.loads(data)
                          assert community['ticket_required'] is True
                          assert community['exact_pokestops_verified'] is False
                          routes = {route['id']: route['coords'] for route in community['routes']}
                          assert set(routes) == {'sendai', 'mexico'}
                          assert all(len(points) == 7 for points in routes.values()), 'HTTP: rotas de ingresso incompletas'
                          assert 'ticket-rally-community-20261107.js' in (pathlib.Path('pages-public/spidey-app/index.html')).read_text(encoding='utf-8'), 'Módulo de rotas ausente do HTML'
                          print('Rotas HTTP confirmadas: Sendai 7 + México 7')
                      if name == 'data/stamps.json':
                          rallies = json.loads(data)['rallies']
                          published = [r for r in rallies if r.get('status') == 'published']
                          points = sum(len(r.get('stops', [])) for r in published)
                          assert len(published) >= 11 and points >= 744, f'HTTP: {len(published)} coleções/{points} pontos'
                          print(f'Catálogo HTTP: {len(published)} coleções/{points} pontos')
                      print(f'HTTP confirmado: {name} SHA256={actual}')
                  print('Pacote publicado coincide com build do commit', os.environ['SPIDEY_EXPECTED_SHA'])
                  break
              except (OSError, ValueError, KeyError, AssertionError) as exc:
                  error = str(exc)
                  print(f'Validação HTTP {attempt+1}/12: {error}')
                  if attempt < 11:
                      time.sleep(15)
          else:
              raise SystemExit('Publicação não comprovada por HTTP: ' + str(error))
          PY
      - name: Confirmar no endereço público as 27 coordenadas do Trust
        run: node scripts/qa_trust_27_public_pages.mjs
      - name: Confirmar no endereço público as 5 imagens oficiais da Wild Area
        run: node scripts/qa_wild_cdmx_public_pages.mjs
