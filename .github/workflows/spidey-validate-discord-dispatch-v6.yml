name: Spidey - validar disparo Discord v6

on:
  push:
    branches: [main]
    paths: [".github/workflows/spidey-validate-discord-dispatch-v6.yml"]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      APPROVAL_CHANNEL_ID: "1550963072464715997"
      SPIDEY_ENDPOINT: "https://spidey-pokemon-go.onrender.com/enviar"
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install requests

      - name: Confirmar regra de aprovação
        shell: bash
        run: |
          python - <<'PY'
          s=open('bot.py',encoding='utf-8').read()
          assert 'and not conteudo["imagem_bytes"]' in s
          assert 'conteudo["modo_arte"] != "premium"' not in s
          assert 'components=_botoes_aprovacao(token)' not in s
          print('REGRA_APROVACAO_OK')
          print('SEM_COMPONENTES_NATIVOS_OK')
          PY

      - name: Disparo real controlado
        shell: bash
        run: |
          python - <<'PY'
          import os,re,time,requests
          token=os.environ['DISCORD_BOT_TOKEN'].strip(); cid=os.environ['APPROVAL_CHANNEL_ID']; endpoint=os.environ['SPIDEY_ENDPOINT']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          def getmsgs():
              r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':50},timeout=30)
              r.raise_for_status(); return r.json()
          before={m['id'] for m in getmsgs()}
          payload={
            'titulo':'🧪 TESTE CONTROLADO • DISCORD V6',
            'mensagem':'Validação do novo disparo do Spidey.\n\n📌 Fonte: teste interno.\n🕷️ Será rejeitado e apagado automaticamente.',
            'url':None,
            'imagem_url':'https://raw.githubusercontent.com/asaquevoa1-ctrl/spidey-pokemon-go/main/assets/spidey-comic-con-malaga-2026-exclusive.png',
            'gerar_arte':False,
            'gerar_gpx':False,
            'aprovar':True,
          }
          r=requests.post(endpoint,json=payload,timeout=180)
          print('SPIDEY_HTTP',r.status_code)
          print('SPIDEY_RESPONSE',r.text[:800])
          r.raise_for_status(); d=r.json()
          assert d.get('status')=='enviado' and d.get('etapa')=='aguardando_aprovacao' and d.get('arte') is True,d
          time.sleep(3)
          new=[m for m in getmsgs() if m['id'] not in before]
          hits=[]
          for m in new:
              e=(m.get('embeds') or [{}])[0]
              txt=((e.get('title') or '')+' '+(e.get('description') or '')).upper()
              if 'TESTE CONTROLADO' in txt and 'DISCORD V6' in txt: hits.append(m)
          assert len(hits)==1,f'Esperava 1 card; encontrei {len(hits)}; novas={[m["id"] for m in new]}'
          m=hits[0]; e=(m.get('embeds') or [{}])[0]; desc=e.get('description') or ''
          assert '[APROVAR]' in desc and '[REPROVAR]' in desc,desc
          extras=[x for x in new if 'DECIDA ABAIXO' in (x.get('content') or '').upper()]
          assert not extras,[x['id'] for x in extras]
          img=(e.get('image') or {}).get('proxy_url') or (e.get('image') or {}).get('url') or ''
          assert img and not img.startswith('attachment://'),img
          ir=requests.get(img,timeout=30); ir.raise_for_status()
          assert ir.headers.get('content-type','').startswith('image/') and len(ir.content)>50000,(ir.headers,len(ir.content))
          reject=re.search(r'\[REPROVAR\]\((https?://[^)]+)\)',desc,re.I); assert reject,desc
          rr=requests.get(reject.group(1),timeout=30); print('REPROVAR_HTTP',rr.status_code); rr.raise_for_status(); assert 'rejeitada' in rr.text.lower()
          print('UM_UNICO_CARD_OK')
          print('ARTE_NO_CARD_OK',len(ir.content))
          print('APROVAR_REPROVAR_NO_CARD_OK')
          print('SEM_MENSAGEM_EXTRA_OK')
          print('TEST_MESSAGE_ID',m['id'])
          dr=requests.delete(f'https://discord.com/api/v10/channels/{cid}/messages/{m["id"]}',headers=h,timeout=30)
          print('LIMPEZA_HTTP',dr.status_code)
          PY
