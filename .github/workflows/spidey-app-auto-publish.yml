name: Spidey App - autopublicação validada

on:
  push:
    branches:
      - main
    paths:
      - "queue/app-ready/**"
      - "scripts/app_auto_publish.py"
      - "scripts/test_app_auto_publish.py"
      - ".github/workflows/spidey-app-auto-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-app-content-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validar gate e dados
        run: |
          set -euo pipefail
          python -m py_compile scripts/app_auto_publish.py scripts/test_app_auto_publish.py
          python -m scripts.test_app_auto_publish
          python -m json.tool spidey-app/data/events.json >/dev/null
          python -m json.tool spidey-app/data/stamps.json >/dev/null

      - name: Publicar somente candidatos aprovados pelo gate automático
        run: python scripts/app_auto_publish.py

      - name: Validar saída
        run: |
          set -euo pipefail
          python -m json.tool spidey-app/data/events.json >/dev/null
          python -m json.tool spidey-app/data/stamps.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('queue/app-ready').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('JSON OK')
          PY

      - name: Gravar resultado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/app-ready spidey-app/data/events.json spidey-app/data/stamps.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de conteúdo público."
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^spidey-app/data/'; then
            MSG="Spidey App: publica conteúdo validado automaticamente"
          else
            MSG="Spidey App: envia candidato para revisão [skip ci]"
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main
