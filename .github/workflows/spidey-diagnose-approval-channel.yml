name: Spidey - diagnosticar canal de aprovacao

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-diagnose-approval-channel.yml"
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler ultimas mensagens do canal de aprovacao
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, requests
          token=os.environ.get('DISCORD_BOT_TOKEN','').strip()
          if not token:
              raise SystemExit('DISCORD_BOT_TOKEN_AUSENTE')
          cid=os.environ['APPROVAL_CHANNEL_ID']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          r=requests.get(f'https://discord.com/api/v10/channels/{cid}',headers=h,timeout=30)
          print('CHANNEL_HTTP',r.status_code)
          r.raise_for_status()
          c=r.json()
          print('CHANNEL_NAME',c.get('name'))
          print('CHANNEL_ID',c.get('id'))
          r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':20},timeout=30)
          print('MESSAGES_HTTP',r.status_code)
          r.raise_for_status()
          msgs=r.json()
          print('MESSAGE_COUNT',len(msgs))
          for m in msgs:
              embeds=m.get('embeds') or []
              title=(embeds[0].get('title') if embeds else '') or ''
              content=(m.get('content') or '').replace('\n',' ')[:120]
              print('MSG',m.get('id'),'TITLE=',title[:180],'CONTENT=',content)
          needles=('G47IX','ULTRA BEAST','MLB','MARINERS')
          found=[]
          for m in msgs:
              embeds=m.get('embeds') or []
              text=' '.join([(m.get('content') or '')]+[(e.get('title') or '')+' '+(e.get('description') or '') for e in embeds]).upper()
              if any(n in text for n in needles):
                  found.append(m.get('id'))
          print('TARGET_FOUND',','.join(found) if found else 'NONE')
          PY
