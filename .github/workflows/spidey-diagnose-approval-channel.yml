name: Spidey - diagnosticar canal de aprovacao

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spidey-diagnose-approval-channel.yml"
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler mensagens alvo e gerar links diretos
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, requests
          token=os.environ.get('DISCORD_BOT_TOKEN','').strip()
          if not token:
              raise SystemExit('DISCORD_BOT_TOKEN_AUSENTE')
          cid=os.environ['APPROVAL_CHANNEL_ID']
          h={'Authorization':f'Bot {token}','User-Agent':'SpideyPokemonGO/1.0'}
          r=requests.get(f'https://discord.com/api/v10/channels/{cid}',headers=h,timeout=30)
          r.raise_for_status()
          c=r.json()
          guild=str(c.get('guild_id') or '')
          print('CHANNEL_NAME',c.get('name'))
          print('CHANNEL_ID',cid)
          print('GUILD_ID',guild)
          r=requests.get(f'https://discord.com/api/v10/channels/{cid}/messages',headers=h,params={'limit':50},timeout=30)
          r.raise_for_status()
          msgs=r.json()
          matches=[]
          for m in msgs:
              embeds=m.get('embeds') or []
              title=(embeds[0].get('title') if embeds else '') or ''
              upper=title.upper()
              if ('G47IX' in upper and 'APROVAÇÃO' in upper) or ('MLB' in upper and 'APROVAÇÃO' in upper):
                  matches.append((int(m['id']),m['id'],title,len(m.get('components') or []),len(m.get('attachments') or [])))
          for _,mid,title,components,attachments in sorted(matches, reverse=True):
              print('TARGET',title)
              print('MESSAGE_ID',mid)
              print('COMPONENT_ROWS',components)
              print('ATTACHMENTS',attachments)
              if guild:
                  print('LINK',f'https://discord.com/channels/{guild}/{cid}/{mid}')
          PY
