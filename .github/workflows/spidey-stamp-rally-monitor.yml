name: Spidey Stamps - monitor oficial

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/stamp_rally_monitor.py"
      - ".github/workflows/spidey-stamp-rally-monitor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-stamp-rally-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependências
        run: python -m pip install --quiet requests

      - name: Validar monitor
        run: python -m py_compile scripts/stamp_rally_monitor.py

      - name: Consultar página oficial
        run: python scripts/stamp_rally_monitor.py

      - name: Gravar somente se houver atualização oficial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/app-ready
          if git diff --cached --quiet; then
            echo "Sem mudança oficial no Stamp Rally."
            exit 0
          fi
          git commit -m "Spidey Stamps: detecta atualização oficial"
          git pull --rebase origin main
          git push origin HEAD:main
