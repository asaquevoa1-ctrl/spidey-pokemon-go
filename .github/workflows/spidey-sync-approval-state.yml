name: Spidey - sincronizar decisões do Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_approval_state.py"
      - ".github/workflows/spidey-sync-approval-state.yml"

permissions:
  contents: write

concurrency:
  group: spidey-sync-approval-state
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        run: python -m pip install --quiet requests

      - name: Sincronizar decisões
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
        run: python scripts/sync_approval_state.py

      - name: Gravar estado da fila
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/curated || true
          if git diff --cached --quiet; then
            echo "Nenhuma decisão nova."
            exit 0
          fi
          git commit -m "Spidey: sincroniza decisão editorial [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
