name: TEMP Spidey Tabs v2

on:
  push:
    branches:
      - spidey-tabs-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: spidey-tabs-v2
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Aplicar patch
        run: |
          set -euo pipefail
          python -m py_compile scripts/patch_tabs_v2.py
          python scripts/patch_tabs_v2.py
          python -m scripts.build_spidey_weekly

      - name: Validar app
        run: |
          set -euo pipefail
          node --check spidey-app/app.js
          node --check spidey-app/weekly.js
          node --check spidey-app/map.js
          node --check spidey-app/sw.js
          python -m py_compile scripts/build_spidey_weekly.py
          python -m json.tool spidey-app/data/weekly.json >/dev/null
          grep -q 'id="weeklyView"' spidey-app/index.html
          grep -q 'data-view="weeklyView"' spidey-app/index.html
          grep -q 'id="worldMap"' spidey-app/index.html
          grep -q 'tabs-v2.css' spidey-app/index.html
          grep -q 'weekly.js' spidey-app/index.html
          grep -q 'map.js' spidey-app/index.html
          grep -q 'data/weekly.json' spidey-app/sw.js
          grep -q 'APP_WEEKLY_FILE' scripts/build_spidey_weekly.py

      - name: Gravar estado validado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spidey-app/index.html spidey-app/app.js spidey-app/sw.js spidey-app/data/weekly.json scripts/build_spidey_weekly.py .github/workflows/spidey-weekly.yml
          if git diff --cached --quiet; then
            echo 'Nada a gravar.'
            exit 0
          fi
          git commit -m "Spidey Tabs: integra Semana, Stamps e Mapa [skip ci]"
          git push origin HEAD:spidey-tabs-v2
