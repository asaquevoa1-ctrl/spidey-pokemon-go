name: Spidey - fila editorial curada

on:
  push:
    branches: [main]
    paths:
      - "queue/curated/**"
      - "scripts/send_curated.py"
      - "scripts/test_curated_format.py"
      - ".github/workflows/spidey-curated.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-curated
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        run: python -m pip install --quiet requests

      - name: Validar codigo
        run: python -m py_compile scripts/send_curated.py scripts/test_curated_format.py

      - name: Testar fusos e monetizacao
        run: python scripts/test_curated_format.py

      - name: Enviar itens curados para aprovacao
        id: enviar_curados
        continue-on-error: true
        env:
          SPIDEY_ENDPOINT: https://spidey-pokemon-go.onrender.com/enviar
        run: python scripts/send_curated.py

      - name: Gravar estado da fila
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/curated || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de estado."
            exit 0
          fi
          git commit -m "Spidey: marca curadoria como enviada [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirmar resultado
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.enviar_curados.outcome }}" != "success" ]]; then
            echo "Um ou mais itens falharam, mas os envios bem-sucedidos tiveram o estado preservado."
            exit 1
          fi
