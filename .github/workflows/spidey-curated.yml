name: Spidey - fila editorial curada

on:
  push:
    branches: [main]
    paths:
      - "queue/curated/**"
      - "scripts/send_curated.py"
      - "scripts/send_curated_resilient.py"
      - "scripts/spidey_art_guard.py"
      - "scripts/test_curated_format.py"
      - ".github/workflows/spidey-curated.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spidey-editorial-state-writer
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        run: python -m pip install --quiet requests pillow

      - name: Validar codigo
        run: python -m py_compile scripts/send_curated.py scripts/send_curated_resilient.py scripts/spidey_art_guard.py scripts/test_curated_format.py spidey_geo.py

      - name: Testar fusos e monetizacao
        run: python scripts/test_curated_format.py

      - name: Aplicar padrão premium obrigatório
        run: python scripts/spidey_art_guard.py

      - name: Enviar itens curados para aprovacao
        id: enviar_curados
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPROVAL_CHANNEL_ID: "1550963072464715997"
        run: python scripts/send_curated_resilient.py

      - name: Gravar estado da fila
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/curated || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de estado."
            exit 0
          fi
          git commit -m "Spidey: atualiza estado editorial [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirmar resultado
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.enviar_curados.outcome }}" != "success" ]]; then
            echo "Um ou mais itens falharam, mas os estados bem-sucedidos foram preservados."
            exit 1
          fi
