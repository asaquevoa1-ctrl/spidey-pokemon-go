name: Spidey - enviar ESA para aprovacao

on:
  push:
    paths:
      - ".github/workflows/spidey-import-sps-events.yml"

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar evento ESA para aprovacao
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 120 \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "https://spidey-pokemon-go.onrender.com/enviar" <<'JSON'
          {
            "titulo": "🚀 EVENTO • Pokémon GO x Agência Espacial Europeia",
            "mensagem": "Pokémon GO e a Agência Espacial Europeia (ESA) anunciaram uma colaboração especial. De 4 de outubro de 2026 a 30 de abril de 2027, museus participantes na Europa terão Reides de 1 estrela com Pikachu Astronauta, Pesquisa Temporária e encontros especiais. Pikachu Astronauta poderá vir com Fundo de Localização e também poderá aparecer Brilhante.\n\nDe 4 a 10 de outubro, os locais participantes também terão Pesquisa de Campo e mais aparições de Pikachu, Clefairy, Magnemite, Starmie, Lunatone, Solrock, Elgyem e Blipbug.\n\nMuseus participantes: Science Museum (Londres), Cité de l’espace (Toulouse), Deutsches Museum (Nuremberg), Museu de les Ciències (Valência), Space Expo (Noordwijk) e Euro Space Center (Transinne).\n\nLocais da ESA em Paris, Frascati, Darmstadt, Madrid, Noordwijk, Redu e Harwell também terão o gameplay entre 4 e 10 de outubro, mas sem Fundos de Localização.\n\nFonte oficial: Pokémon GO / ESA",
            "url": "https://pokemongo.com/en/news/european-space-agency-event",
            "gerar_gpx": false,
            "gerar_arte": false,
            "aprovar": true
          }
          JSON
