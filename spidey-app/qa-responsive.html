<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spidey — QA responsivo</title><style>body{margin:0;background:#07162d;color:#e5edf5;font:15px system-ui}header{padding:16px;display:flex;gap:16px;align-items:center}button{padding:12px;cursor:pointer}iframe{display:block;border:1px solid #476581;margin:0 auto;background:white;height:850px;max-width:100%}span{margin-left:auto}</style></head><body><header><strong>QA responsivo • Preview</strong><button data-width="390">Mobile 390px</button><button data-width="1280">Desktop 1280px</button><span id="size">390 × 850</span></header><iframe id="app" title="Aplicativo Spidey em viewport de teste" src="index.html" width="390" height="850"></iframe><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelector('iframe').width=b.dataset.width;document.querySelector('#size').textContent=b.dataset.width+' × 850'}))</script></body></html>
